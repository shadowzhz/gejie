<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1917">
  <title>蛊界 · 青茅山篇</title>
  <style>
:root {
  --bg: #0a0f0e;
  --bg2: #111917;
  --card: #131c1a;
  --card2: #192522;
  --line: #293c36;
  --line-gold: rgba(207, 169, 104, 0.28);
  --ink: #e5dfd2;
  --dim: #8c9991;
  --jade: #5ea68b;
  --gold: #cfa968;
  --blood: #c9594d;
  --warn: #d4964c;
  --zy: #5492a8;
  --radius: 4px;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(45, 76, 65, 0.22), transparent 58%),
    radial-gradient(circle at 88% 90%, rgba(207, 169, 104, 0.06), transparent 44%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  line-height: 1.6;
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}

/* 宣纸与墨雾细微肌理 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.035;
  background-image: radial-gradient(#e5dfd2 0.6px, transparent 0.6px);
  background-size: 14px 14px;
}

h1, h2, h3, .stage-loc, .title-main, .story-scroll, .foe-name b, .person-seal, .dossier-card summary {
  font-family: var(--serif);
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #1b2824, #141e1b);
  border-radius: var(--radius);
  padding: 7px 14px;
  min-height: 38px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
}
button:hover:not(:disabled) {
  background: linear-gradient(180deg, #22332e, #182521);
  border-color: var(--jade);
}
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary {
  background: linear-gradient(180deg, #1f4b3d, #16382d);
  border-color: var(--jade);
  color: #f0f7f4;
  font-weight: 600;
}
button.primary:hover:not(:disabled) { background: linear-gradient(180deg, #265c4b, #1a4436); }
button.gold {
  background: linear-gradient(180deg, #3c301c, #2b2213);
  border-color: var(--gold);
  color: #f3e4c3;
  font-weight: 600;
}
button.gold:hover:not(:disabled) { background: linear-gradient(180deg, #4b3c22, #352917); }
button.blood {
  background: linear-gradient(180deg, #49221f, #361816);
  border-color: var(--blood);
  color: #fae0dc;
  font-weight: 600;
}
button.blood:hover:not(:disabled) { background: linear-gradient(180deg, #5b2a26, #431d1a); }
button.ghost { background: transparent; box-shadow: none; }
button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.04); }
button.sm { min-height: 30px; padding: 4px 10px; font-size: .84rem; }

.shell {
  position: relative;
  z-index: 1;
  max-width: 920px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 72px;
}

.start-shell {
  padding: 20px 14px;
  justify-content: center;
  gap: 14px;
}

/* 顶部在场状态栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(10, 15, 14, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  padding: 8px 14px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.top-id { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.top-id strong { font-size: 1.08rem; font-family: var(--serif); color: var(--gold); letter-spacing: .04em; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: .76rem;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--dim);
}
.badge.jade { border-color: rgba(94, 166, 139, 0.55); color: var(--jade); }
.badge.gold { border-color: rgba(207, 169, 104, 0.55); color: var(--gold); }
.badge.blood { border-color: rgba(201, 89, 77, 0.55); color: var(--blood); }
.place-pill {
  min-height: 0;
  padding: 2px 9px;
  font-size: .78rem;
  color: var(--ink);
  border-color: var(--line-gold);
  background: rgba(207, 169, 104, 0.08);
}

.clock-box {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: .82rem;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.clock-box button.sm { min-height: 26px; padding: 2px 8px; font-size: .78rem; }

.res-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: center; }
.res-item { min-width: 0; }
.res-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: .75rem;
  color: var(--dim);
  margin-bottom: 3px;
  font-variant-numeric: tabular-nums;
}
.res-meta .res-head { margin-bottom: 0; white-space: nowrap; }
.res-meta b { color: var(--gold); font-weight: 600; }

.bar { height: 5px; background: #070b0a; border-radius: 2px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); }
.bar > i { display: block; height: 100%; background: var(--jade); transition: width .25s ease; }
.bar.hp > i { background: linear-gradient(90deg, #9c3f37, #cf6255); }
.bar.zy > i { background: linear-gradient(90deg, #356c80, #5da2ba); }

/* 折叠式竹简流转要务条 */
.goal-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 4px;
  border-top: 1px solid rgba(41, 60, 54, 0.55);
  font-size: .8rem;
}
.goal-toggle {
  min-height: 22px;
  padding: 1px 7px;
  font-size: .72rem;
  font-family: var(--serif);
  color: var(--gold);
  border-color: var(--line-gold);
  background: rgba(207, 169, 104, 0.09);
}
.goal-text { flex: 1 1 12rem; color: #cfc6b2; }
.goal-strip.is-collapsed { opacity: 0.78; }

/* 主内容区与卡片 */
.main { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 12px; }

.card {
  position: relative;
  background: linear-gradient(180deg, rgba(22, 32, 29, 0.96), rgba(16, 24, 22, 0.98));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: inset 0 0 0 1px rgba(207, 169, 104, 0.06), 0 6px 20px rgba(0, 0, 0, 0.28);
}
.card h2, .card h3 { margin: 0 0 8px; font-size: 1.04rem; color: var(--gold); letter-spacing: .04em; }
.muted { color: var(--dim); font-size: .87rem; }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

/* 场景主舞台 */
.stage {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #101917;
  box-shadow: inset 0 0 0 1px rgba(207, 169, 104, 0.1), 0 10px 28px rgba(0, 0, 0, 0.42);
}
.stage-art {
  display: block;
  width: 100%;
  height: 112px;
  border-bottom: 1px solid rgba(41, 60, 54, 0.7);
}
.stage-inner { padding: 14px 16px 16px; }
.stage-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 8px;
}
.stage-loc { font-size: .8rem; color: var(--gold); letter-spacing: .08em; margin-bottom: 2px; }
.stage h1 { margin: 0; font-size: 1.68rem; font-weight: 700; letter-spacing: .06em; color: #f2ece0; }
.stage-desc { margin: 0 0 10px; color: #d6cfc0; font-size: .95rem; line-height: 1.72; }
.stage-gather { margin: 0 0 12px; font-size: .82rem; color: var(--jade); }
.stage-actions { margin-bottom: 4px; }
.stage-paths {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed rgba(41, 60, 54, 0.8);
}
.stage-paths-label {
  font-size: .76rem;
  font-family: var(--serif);
  color: var(--dim);
  margin-right: 2px;
}
.path-chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  min-height: 28px;
  padding: 2px 10px;
  font-size: .82rem;
  background: rgba(12, 18, 17, 0.7);
}
.path-chip small { font-size: .72rem; color: var(--gold); }
.path-chip.is-blocked small { color: var(--blood); }

.person-seal {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-color: var(--line-gold);
  background: rgba(207, 169, 104, 0.06);
}
.seal-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 6px rgba(207, 169, 104, 0.7);
}

/* 开屏标题与开窍大典 */
.title-hero .stage-art { height: 140px; }
.title-seal {
  display: inline-block;
  font-size: .76rem;
  letter-spacing: .16em;
  color: var(--gold);
  border: 1px solid var(--line-gold);
  padding: 2px 10px;
  margin-bottom: 8px;
}
.title-main { font-size: 2.3rem !important; letter-spacing: .18em !important; margin-bottom: 10px !important; }
.title-box { margin-top: 12px; background: rgba(10, 15, 14, 0.7); }
.hope-svg { display: block; width: 100%; max-height: 155px; margin: 10px 0 4px; border: 1px solid rgba(84, 146, 168, 0.3); border-radius: var(--radius); }
.ritual-result { border-color: var(--line-gold); }

/* 山野舆图 */
.map-sheet-wrap { display: flex; flex-direction: column; gap: 10px; }
.map-scroll {
  overflow-x: auto;
  border: 1px solid var(--line-gold);
  border-radius: var(--radius);
  background: #0b1110;
}
.map-canvas {
  position: relative;
  min-width: 640px;
  height: 360px;
  background: radial-gradient(circle at 30% 48%, rgba(62, 107, 89, 0.14), transparent 55%), #0c1211;
}
.map-canvas.is-night {
  background: radial-gradient(circle at 30% 48%, rgba(56, 92, 112, 0.14), transparent 55%), #080d10;
}
.map-terrain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-edge { stroke: #314740; stroke-width: .45; stroke-dasharray: 1.2 1.2; opacity: .7; }
.map-edge.is-active { stroke: var(--jade); stroke-width: .9; stroke-dasharray: none; opacity: .95; }
.map-edge.is-blocked { stroke: var(--blood); stroke-width: .65; stroke-dasharray: 1 1; opacity: .75; }
.map-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 68px;
  min-height: 0;
  padding: 4px 8px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: rgba(14, 21, 19, 0.94);
  font-size: .78rem;
  line-height: 1.25;
  white-space: nowrap;
  z-index: 1;
}
.map-node b { font-family: var(--serif); font-weight: 600; }
.map-node small { font-size: .68rem; color: var(--dim); margin-top: 1px; }
.map-node.is-here {
  border-color: var(--jade);
  background: #17352c;
  box-shadow: 0 0 0 2px rgba(94, 166, 139, 0.28);
  z-index: 3;
}
.map-node.is-here small { color: var(--jade); font-weight: 600; }
.map-node.is-move { border-color: var(--gold); z-index: 2; }
.map-node.is-move small { color: var(--gold); }
.map-node.is-move:hover:not(:disabled) { background: #26362d; transform: translate(-50%, -54%); }
.map-node.is-far { opacity: .48; }
.map-legend { display: flex; gap: 14px; font-size: .78rem; color: var(--dim); }
.map-legend span { display: inline-flex; align-items: center; gap: 5px; }
.map-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; border: 1px solid var(--line); }
.dot-here { background: #17352c; border-color: var(--jade) !important; }
.dot-move { background: #1c241e; border-color: var(--gold) !important; }
.dot-lock { background: #141918; border-color: var(--blood) !important; }
.map-blocked { font-size: .8rem; color: var(--dim); display: flex; flex-direction: column; gap: 2px; }

/* 空窍画布与真元海 SVG */
.aperture-canvas {
  position: relative;
  min-height: 172px;
  border-radius: var(--radius);
  border: 1px solid var(--line-gold);
  background: #0a1010;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.aperture-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.ap-wave { animation: sea-sway 7s ease-in-out infinite alternate; }
.ap-wave2 { animation: sea-sway 5.5s ease-in-out infinite alternate-reverse; }
@keyframes sea-sway {
  from { transform: translateX(-14px); }
  to { transform: translateX(14px); }
}
.aperture-hud {
  position: relative;
  z-index: 1;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 172px;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(10, 15, 14, 0.55) 0%, rgba(10, 15, 14, 0.1) 50%, rgba(10, 15, 14, 0.6) 100%);
}
.aperture-gu-list { display: flex; flex-wrap: wrap; gap: 6px; }
.gu-chip {
  padding: 3px 9px;
  border-radius: 3px;
  font-size: .8rem;
  font-family: var(--serif);
  background: rgba(12, 18, 17, 0.85);
  border: 1px solid rgba(94, 166, 139, 0.65);
}
.gu-chip.weak { border-color: var(--blood); color: var(--blood); }

.slot-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 6px;
}
.slot-pill {
  text-align: center;
  padding: 5px 6px;
  font-size: .8rem;
  font-family: var(--serif);
  border-radius: 3px;
  border: 1px solid rgba(94, 166, 139, 0.5);
  background: rgba(24, 42, 36, 0.55);
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.slot-pill.is-empty {
  border-style: dashed;
  border-color: var(--line);
  background: transparent;
  color: var(--dim);
  font-family: var(--sans);
}
.slot-pill.is-weak { border-color: var(--blood); color: var(--blood); }

.killer-card {
  padding: 10px 12px;
  border: 1px solid var(--line-gold);
  border-radius: var(--radius);
  background: rgba(12, 17, 16, 0.72);
}

/* 蛊囊列表 */
.gu-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.gu-head h3 { margin: 0; }
.gu-list { list-style: none; margin: 0; padding: 0; }
.gu-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  padding: 11px 0 11px 12px;
  border-top: 1px solid rgba(41, 60, 54, 0.55);
  border-left: 2px solid transparent;
}
.gu-row:first-child { border-top: 0; }
.gu-row.is-equipped { border-left-color: var(--jade); background: linear-gradient(90deg, rgba(94, 166, 139, 0.05), transparent 40%); }
.gu-main { min-width: 0; }
.gu-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gu-title b { font-size: 1rem; font-family: var(--serif); }
.gu-meta { font-size: .78rem; color: var(--dim); }
.gu-tag { font-size: .74rem; color: var(--gold); }
.gu-tag.is-weak { color: var(--blood); }
.gu-tag::before { content: "· "; color: var(--dim); }
.gu-desc { margin: 3px 0 5px; font-size: .85rem; color: var(--dim); }
.gu-stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: #cdd6cf; }
.gu-stats span { padding: 1px 6px; border-radius: 2px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.05); }
.gu-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 132px; }
.gu-hunger { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.gu-hunger .bar { width: 64px; height: 4px; }
.gu-hunger.is-low { color: var(--blood); }
.gu-hunger.is-low .bar > i { background: var(--blood); }
.gu-food { font-size: .76rem; color: var(--dim); }
.gu-food.is-empty { color: var(--warn); }
.gu-actions { display: flex; gap: 6px; margin-top: 2px; flex-wrap: wrap; justify-content: flex-end; }
.gu-actions button.sm { min-height: 28px; padding: 2px 10px; }
.gu-note { font-size: .78rem; color: var(--dim); }
@media (max-width: 520px) {
  .gu-row { grid-template-columns: 1fr; gap: 6px; }
  .gu-side { flex-direction: row; flex-wrap: wrap; align-items: center; min-width: 0; }
  .gu-actions { margin: 0 0 0 auto; }
}

/* 底部导航 */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: rgba(10, 15, 14, 0.97);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.4);
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 2px;
  padding: 5px 8px;
}
.nav button {
  position: relative;
  min-height: 44px;
  padding: 4px 2px;
  font-size: .84rem;
  font-family: var(--serif);
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  color: var(--dim);
}
.nav button.on {
  color: var(--gold);
  background: rgba(207, 169, 104, 0.08);
  border-color: var(--line-gold);
  font-weight: 600;
}

/* 弹窗与古卷阅读 */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(4, 7, 7, 0.82);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.modal[hidden] { display: none; }
.sheet {
  width: min(580px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: linear-gradient(180deg, #131c1a, #0e1514);
  border: 1px solid var(--line-gold);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.sheet h2 { margin: 0; color: var(--gold); font-size: 1.25rem; letter-spacing: .05em; }
.place-sheet { width: min(860px, 100%); }
.refine-sheet { width: min(640px, 100%); }
.place-sheet-controls {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  justify-content: flex-end;
}

.story-header { border-bottom: 1px solid rgba(207, 169, 104, 0.22); padding-bottom: 8px; }
.story-kicker { display: block; font-size: .74rem; color: var(--gold); letter-spacing: .16em; margin-bottom: 2px; }
.story-scroll {
  white-space: pre-line;
  font-size: .98rem;
  line-height: 1.85;
  color: #e4ddd0;
  padding: 12px 14px;
  background: rgba(8, 12, 11, 0.55);
  border-left: 2px solid var(--line-gold);
  border-radius: 2px;
}
.person-quote { font-size: .95rem; }
.person-dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

.story-choices-col { display: flex; flex-direction: column; gap: 8px; }
.story-choice-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  padding: 10px 14px;
  border-color: var(--line);
  background: rgba(20, 30, 27, 0.9);
}
.story-choice-btn:hover:not(:disabled) {
  border-color: var(--gold);
  background: rgba(45, 38, 22, 0.55);
}
.choice-idx {
  flex: 0 0 auto;
  display: inline-block;
  min-width: 22px;
  text-align: center;
  font-family: var(--serif);
  font-size: .8rem;
  color: var(--gold);
  border: 1px solid var(--line-gold);
  padding: 0 4px;
  margin-top: 2px;
}

/* 破壁冲关 */
.break-hero {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 14px;
  align-items: center;
}
.break-svg { width: 100%; height: auto; display: block; }
.break-metrics { display: flex; flex-direction: column; gap: 4px; }

/* 炼蛊炉鼎 */
.refine-ritual { display: grid; gap: 12px; }
.refine-stage {
  --ember: #e09c4d;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: radial-gradient(ellipse at 50% 65%, #1c2c25, #0a100f 75%);
  text-align: center;
  padding: 8px 12px 12px;
}
.refine-scene { position: relative; width: 220px; height: 156px; margin: auto; }
.furnace-svg { width: 100%; height: 100%; display: block; }
.refine-stage[data-state="ongoing"] .furnace-flame-group {
  transform-origin: 110px 124px;
  animation: furnace-breathe 1.2s infinite alternate ease-in-out;
}
.refine-stage[data-state="ongoing"][data-hot="true"] .furnace-body {
  animation: furnace-shake .55s infinite;
}
.refine-stage[data-state="failure"] .refine-status { color: var(--blood); }
.refine-status { padding: 4px 8px; color: var(--gold); font-family: var(--serif); font-weight: 600; }
.refine-feedback { padding: 2px 8px 0; color: var(--ink); font-size: .88rem; }
.refine-timing {
  position: relative;
  height: 12px;
  width: min(260px, 80%);
  margin: 10px auto 6px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: linear-gradient(90deg, #3c2220 25%, #23473d 25% 40%, #b5924c 40% 60%, #23473d 60% 75%, #3c2220 75%);
}
.refine-timing > i {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 4px;
  border-radius: 1px;
  translate: -50% 0;
  background: #fff3d1;
  box-shadow: 0 0 8px 2px #ffbe6d;
  animation: furnace-timing 1.5s infinite alternate linear;
}
.refine-drop {
  position: absolute;
  top: 22px;
  left: 50%;
  translate: -50% 0;
  padding: 2px 9px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  background: var(--bg2);
  font-size: .82rem;
  white-space: nowrap;
  animation: furnace-drop .5s ease-in both;
}
@keyframes furnace-timing { from { left: 0; } to { left: 100%; } }
@keyframes furnace-drop { 70% { opacity: 1; } to { transform: translateY(38px) scale(.4); opacity: 0; } }
@keyframes furnace-breathe { from { transform: scale(.93, .88); } to { transform: scale(1.06, 1.12); } }
@keyframes furnace-shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }

function rareGathering(gs, place, minute = gs.minutes) {

function shopUnitPrice(gs, id, price) {

function merchantRefuses(gs) {
  return gs.location === 'gupu' && gs.minutes >= makeTime(2, 3, 1) && gs.minutes < makeTime(2, 3, 9)

function placeShopEntries(gs) {
  const shop = PLACES[gs.location]?.shop ?? [];
  if (gs.location !== 'gupu') return shop;
  const entries = [...shop];
  if (gs.player.rank >= 2) entries.push(...SECOND_RANK_SHOP_GU.map((id) => `gu:${id}`));
  if (gs.flags.kaike) entries.push(...ACADEMY_SHOP_GU.map((id) => `gu:${id}`));
  if (gs.minutes >= makeTime(2, 3, 1) && gs.minutes < makeTime(2, 3, 9) && !merchantRefuses(gs)) {
    for (const id of MERCHANT_GU) {
      if (id === 'chitie_sheli' && gs.minutes < makeTime(2, 3, 7)) continue;
      if (!gs.flags[`merchant_${id}_bought`]) entries.push(`gu:${id}`);
    }
  }
  return entries;
}

function recipeOutputText(recipe) {
  const name = (GU_DEFS[recipe.out] || ITEMS[recipe.out]).name;
  return recipe.outCount > 1 ? `${name} ×${recipe.outCount}` : name;
}
function recipeIngredientsText(recipe) {

    .join(' + ');
}

/* === src/core/calendar.js === */
const MIN_PER_KE = 15;
const MIN_PER_SHICHEN = 120;
const MIN_PER_DAY = 1440;
const DAYS_PER_MONTH = 30;
const MONTHS_PER_YEAR = 12;
const MIN_PER_MONTH = MIN_PER_DAY * DAYS_PER_MONTH;
const MIN_PER_YEAR = MIN_PER_MONTH * MONTHS_PER_YEAR;
const SHICHEN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const MONTHS = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
const DIGITS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function makeTime(year, month, day, shichen = 0) {
  return (((year - 1) * MONTHS_PER_YEAR + (month - 1)) * DAYS_PER_MONTH + (day - 1)) * MIN_PER_DAY + shichen * MIN_PER_SHICHEN;
}
function yearOf(m) { return Math.floor(m / MIN_PER_YEAR) + 1; }
function monthOf(m) { return Math.floor(m / MIN_PER_MONTH) % MONTHS_PER_YEAR + 1; }
function dayOf(m) { return Math.floor(m / MIN_PER_DAY) % DAYS_PER_MONTH + 1; }
function minuteOfDay(m) { return ((m % MIN_PER_DAY) + MIN_PER_DAY) % MIN_PER_DAY; }
function shichenOf(m) { return Math.floor(minuteOfDay(m) / MIN_PER_SHICHEN); }
function keOf(m) { return Math.floor((minuteOfDay(m) % MIN_PER_SHICHEN) / MIN_PER_KE) + 1; }
function isNight(m) { const mod = minuteOfDay(m); return mod < 360 || mod >= 1080; }
function cnNum(n) {
  if (n <= 10) return DIGITS[n] || String(n);
  if (n < 20) return '十' + DIGITS[n - 10];
  const t = DIGITS[Math.floor(n / 10)] + '十';
  return n % 10 === 0 ? t : t + DIGITS[n % 10];
}
function dayName(d) {
  if (d <= 10) return '初' + DIGITS[d];
  if (d < 20) return '十' + DIGITS[d - 10];
  if (d === 20) return '二十';
  if (d < 30) return '廿' + DIGITS[d - 20];
  return '三十';
}
function formatDateTime(m) {
  return `第${cnNum(yearOf(m))}年 ${MONTHS[monthOf(m) - 1]}${dayName(dayOf(m))} · ${SHICHEN[shichenOf(m)]}时${keOf(m)}刻`;
}
function formatDuration(minutes) {
  if (minutes >= MIN_PER_DAY) return `${Math.round(minutes / MIN_PER_DAY)} 日`;
  if (minutes >= MIN_PER_SHICHEN && minutes % MIN_PER_SHICHEN === 0) return `${minutes / MIN_PER_SHICHEN} 时辰`;
  return `${Math.max(1, Math.round(minutes / MIN_PER_KE))} 刻`;
}
function parseTimeExpr(str) {
  const parts = String(str).split('-');
  if (parts.length < 3) return 0;
  return makeTime(Number(parts[0]) || 1, Number(parts[1]) || 1, Number(parts[2]) || 1, Number(parts[3]) || 0);
}


/* === src/core/story-progress.js === */



function boundRelation(value) {
  return Number.isFinite(value) ? Math.max(-100, Math.min(100, Math.trunc(value))) : 0;
}
function storyRelation(gs, id) {
  if (!Object.hasOwn(STORY_CHARACTERS, id)) return null;
  const saved = gs.story?.relations?.[id];
  return saved || { ...STORY_CHARACTERS[id].initial, progress: '' };
}
function changeStoryRelation(gs, id, favor, trust, progress) {
  const current = storyRelation(gs, id);
  if (!current) return;
  gs.story.relations[id] = {
    favor: boundRelation(current.favor + favor),
    trust: boundRelation(current.trust + trust),
    progress: progress || current.progress
  };
}
function advanceStoryQuest(gs, id, stage, outcome = '') {
  const quest = STORY_QUESTS[id];
  if (!Object.hasOwn(STORY_QUESTS, id)) return;
  const current = gs.story.quests[id];
  const stages = [...Object.keys(quest.steps), 'completed'];
  const index = current ? stages.indexOf(current.stage) : -1;
  if (current && (index < 0 || current.stage === 'completed')) return;
  if (stage !== stages[index + 1] && !(current && stage === 'failed')) return;
  const followupAt = outcome && quest.followupEvent ? gs.minutes + quest.followupDays * MIN_PER_DAY : null;
  gs.story.quests[id] = { stage, outcome, followupAt, clues: current?.clues ?? [] };
}
function addStoryClue(gs, questId, clueId) {
  const progress = gs.story.quests[questId];
  if (progress && Object.hasOwn(STORY_QUESTS[questId].clues, clueId) && !progress.clues.includes(clueId)) {
    progress.clues.push(clueId);
  }
}
function restoreStoryProgress(gs) {
  if (!gs?.player) return;
  const saved = gs.story;
  gs.story = { relations: {}, quests: {}, history: {} };
  if (saved) {
    for (const id of Object.keys(STORY_CHARACTERS)) {
      const relation = saved.relations?.[id];
      if (relation) gs.story.relations[id] = {
        favor: boundRelation(relation.favor),
        trust: boundRelation(relation.trust),
        progress: typeof relation.progress === 'string' ? relation.progress : ''
      };
    }
    for (const [id, quest] of Object.entries(STORY_QUESTS)) {
      const progress = saved.quests?.[id];
      if (!Object.hasOwn(quest.steps, progress?.stage) && !Object.hasOwn(STORY_QUEST_STAGES, progress?.stage)) continue;
      const { stage, outcome, followupAt, clues } = progress;
      gs.story.quests[id] = { stage, outcome, followupAt: Number.isFinite(followupAt) ? followupAt : null, clues: [] };
      if (Array.isArray(clues)) {
        for (const clue of clues) addStoryClue(gs, id, clue);
      }
    }
    for (const id of Object.keys(STORY_CHARACTERS)) {
      if (Number.isInteger(saved.giftDays?.[id])) (gs.story.giftDays ??= {})[id] = saved.giftDays[id];
    }
    if (Number.isFinite(saved.lifeReadyAt)) gs.story.lifeReadyAt = saved.lifeReadyAt;
    if (saved.history && typeof saved.history === 'object') gs.story.history = saved.history;
  } else {
    const flags = gs.flags ?? {};
    if (flags.mo_faction) changeStoryRelation(gs, 'mobei', 20, 30, '学堂同练');
    if (flags.chi_faction) changeStoryRelation(gs, 'chicheng', 20, 30, '替赤脉备货');
    if (flags.bai_read) changeStoryRelation(gs, 'bainingbing', 20, 20, '切磋取胜');
    if (flags['event_done:jia_missing']) {
      gs.story.quests.caravan = flags['event_done:jia_questions']
        ? { stage: 'completed', outcome: 'legacy', followupAt: null, clues: [] }
        : { stage: 'investigate', outcome: '', followupAt: null, clues: [] };
      if (flags.jia_evidence) addStoryClue(gs, 'caravan', 'tracks');
    }
    if (flags['event_done:jia_missing'] && !flags['event_done:jia_questions']) {
      if (flags.jia_evidence) changeStoryRelation(gs, 'jiafu', 5, 5, '替商队保管失物');
      else if (!flags.jia_missing_stones) changeStoryRelation(gs, 'jiafu', 15, 25, '护送伙计回寨');
    }
    if (flags.jia_witness) changeStoryRelation(gs, 'jiafu', 20, 35, '已收下失物与足迹');
    if (flags.jia_missing_stones && !flags['event_done:jia_questions']) {
      changeStoryRelation(gs, 'jiafu', -30, -25, '伙计指认你拿了货款');
    }
  }
}

  const pattern = KILLER_PATTERNS.find((entry) => entry.id === move?.patternId);
  if (!pattern) return '旧杀招需要重新推演';
  const blocked = killerPatternBlock(gs, pattern);
  if (blocked) return blocked;
  const { gu, equipped } = gs.player;
  const resting = pattern.sequence.find((id) => !gu.some((entry) => entry.id === id && equipped.includes(entry.uid)));

  const weak = pattern.sequence.find((id) => !gu.some((entry) => entry.id === id && equipped.includes(entry.uid) && !isGuWeak(entry)));

}
function killerCraftBlock(gs, pattern) {
  if (gs.player.moves.some((move) => move.patternId === pattern.id)) return '已推演';
  const blocked = killerPatternBlock(gs, pattern);
  if (blocked) return blocked;
  if (!hasUsedKillerGu(gs.player, pattern)) return '须分别催动过所需蛊虫';

}
function forgetKillerMove(gs, id) {

  if (index === -1) return null;

function createKillerMove(gs, patternId, customName = '') {

  if (gs.battle) return { ok: false, reason: '请在战斗结束后推演' };
  const reason = killerCraftBlock(gs, pattern);
  if (reason) return { ok: false, reason };

  const { kind, power, bonusShield, cost, cd } = pattern;
  const move = {
    id: `km_${pattern.id}`,
    patternId: pattern.id,
    name: String(customName).trim().slice(0, 10) || pattern.name,
    kind, power, bonusShield, cost, cd
  };
  gs.player.yuanshi -= pattern.fee;
  gs.player.moves.push(move);
  addLog(gs, `【自创杀招】花费 ${pattern.fee} 元石，推演成「${move.name}」。`, 'log-gold');
  return { ok: true, move };
}

const fieldTrialSteps = [
  { id: 'scouted', text: '勘察竹林兽径' },
  { id: 'gathered', text: '在竹林采集一次' },
  { id: 'won', text: '击败一只铁鬃野猪或野猪王' }
];

const fieldRewards = [
  { id: 'stones', stones: [18, 3] },
  { id: 'healing', stones: [6, 1], item: 'zhixuegao', count: [3, 1] },
  { id: 'food', stones: [6, 1], item: 'yuelanhua', count: [12, 3] }
];
function fieldTrialStatus(gs) {
  const p = gs.player;
  if (!p.benming || !gs.flags.practiced || p.escapedMountain) return null;
  const record = p.fieldTrial;
  const repeat = !!record?.firstClaimed;
  const active = !repeat || !!record.active;
  const steps = fieldTrialSteps.map((step) => ({ ...step, done: active && record?.[step.id] === true }));
  const next = steps.find((step) => !step.done);
  const ready = active && !next;
  return {
    title: repeat ? '竹林巡守' : '首次出寨试炼',
    active, steps, next, ready, repeat,
    rewards: ready ? fieldRewards.map(({ id, stones, item, count }) => {
      const index = Number(repeat);
      const quantity = count?.[index];
      const text = `${stones[index]} 元石${item ? ` ＋ ${ITEMS[item].name} ×${quantity}` : ''}`;
      return { id, stones: stones[index], item, quantity, text };
    }) : []
  };
}
function recordFieldTrial(gs, step) {
  if (gs.location !== 'zhulin') return;
  const trial = fieldTrialStatus(gs);
  const entry = trial?.steps.find(({ id }) => id === step);
  if (!trial?.active || !entry || entry.done) return;
  (gs.player.fieldTrial ??= {})[step] = true;
  const progress = trial.steps.filter(({ done }) => done).length + 1;
  addLog(gs, `【${trial.title}】${entry.text} · ${progress}/${trial.steps.length}${progress === trial.steps.length ? '，可回任务堂交付' : ''}。`, 'log-good');
}
function settleFieldTrial(gs, id) {
  const trial = fieldTrialStatus(gs);
  if (gs.location !== 'renwutang' || !trial) return { ok: false, reason: '请到任务堂办理历练。' };
  if (id === 'fieldPatrol' && !trial.active) {
    gs.player.fieldTrial = { firstClaimed: true, active: true };
    addLog(gs, '【竹林巡守】已接取巡守，去月下竹林勘察、采集与清理兽患。');
    return { ok: true, message: '已接取竹林巡守' };
  }
  const reward = trial.rewards.find((entry) => entry.id === id);
  if (!reward) return { ok: false, reason: '请完成三项历练后再选领赏格。' };
  gs.player.fieldTrial = { firstClaimed: true };
  gs.player.yuanshi += reward.stones;
  if (reward.item) addItem(gs, reward.item, reward.quantity);
  const message = `${trial.title}已交付，获得 ${reward.text}`;
  addLog(gs, `【历练】${message}。`, 'log-gold');
  return { ok: true, message, receipt: {
    title: `任务堂 · ${trial.title}已交付`,
    lines: [reward.text]
  } };
}
function fieldRecommendation(gs) {
  const { player: p, flags } = gs;
  if (!p.benming || !flags.practiced || p.escapedMountain) return null;
  const attack = p.gu.some((gu) => {
    const def = GU_DEFS[gu.id];
    return p.equipped.includes(gu.uid) && !isGuWeak(gu)
      && ['攻击', '控制'].includes(def?.kind) && p.zy >= def.cost * 2;
  });
  if (p.hp < p.hpMax / 2) return { place: 'zhulou', text: '气血不足一半，先回竹楼歇息。' };
  if (!attack) return { place: 'zhulin', cautious: true, text: '先在月下竹林勘察、采集。备好出战的攻击蛊和真元后再搜山。' };
  if (flags['clear:xuefu'] && (p.rank >= 3 || (p.rank === 2 && p.xiao >= 2))) {
    return { place: 'langchao', text: '可去电狼坡迎战电狼，采集矿石等山材。' };
  }
  if (p.rank >= 2 || (p.xiao >= 2 && flags['clear:zhulin'])) {
    return { place: 'xuefu', text: '可去血蝠洞搜山，收集玉石与灵晶。' };
  }
  return { place: 'zhulin', text: '月下竹林适合练手。先采口粮、打铁鬃野猪攒元石，再考虑挑战野猪王。' };
}


/* === src/core/combat.js === */





function enemyMoveCost(enemy, move) {
  return move.cost ?? enemy.rank * 4;
}

function pickIntent(enemy, rng = Math.random) {
  const list = enemy.moves.filter((m) => (enemy.cds[m.name] || 0) <= 1 && enemy.zy >= enemyMoveCost(enemy, m));
  if (!list.length) return null;
  const total = list.reduce((s, m) => s + (m.weight || 1), 0);
  let r = rng() * total;
  for (const m of list) {
    r -= (m.weight || 1);
    if (r <= 0) return m;
  }
  return list[0];
}
function startBattle(gs, enemyId, tag = '遭遇战', rng = Math.random, { shield = 0, winFlag, winGu, storyEvent } = {}) {
  const tpl = ENEMIES[enemyId];
  if (!tpl || gs.battle) return null;
  const foe = {
    id: tpl.id,
    name: tpl.name,
    rank: tpl.rank,
    hp: tpl.hp,
    hpMax: tpl.hp,
    zy: tpl.zy,
    zyMax: tpl.zy,
    speed: tpl.speed,
    shield: 0,
    stunned: false,
    moves: tpl.moves,
    cds: {},
    intent: null,
    reward: tpl.reward || {},
    practice: !!tpl.practice
  };
  foe.intent = pickIntent(foe, rng);

  const b = {
    tag,
    round: 1,
    state: 'ongoing', // ongoing | win | lose | fled
    lethal: false,
    scouted: false,
    playerStunned: false,
    meShield: shield,
    winFlag,
    winGu,
    storyEvent,
    meBoost: 0,
    cds: {},
    guQueue: [],
    foe,
    logs: [`【${tag}】${foe.name}挡在前方。`]
  };

  if (foe.speed > gs.player.speed && !foe.practice) {
    b.logs.push(`${foe.name}身法更快，抢先出手！`);
    enemyTurn(gs, b, rng);
  }
  gs.battle = b;
  return b;
}

function enemyTurn(gs, b, rng = Math.random) {
  const foe = b.foe;
  if (foe.hp <= 0) return;
  const speed = b.haste?.turns > 0 ? b.haste.speed : 0;
  if (speed) b.haste.turns--;
  for (const k of Object.keys(foe.cds)) {
    if (foe.cds[k] > 0) foe.cds[k]--;
  }
  if (foe.stunned) {
    foe.stunned = false;
    b.logs.push(`${foe.name}身形一滞，错过了这一轮出手。`);
    foe.intent = pickIntent(foe, rng);
    return;
  }
  const mv = foe.intent;
  if (!mv || foe.zy < enemyMoveCost(foe, mv) || (foe.cds[mv.name] || 0) > 0) {
    b.logs.push(`${foe.name}无招可施，本轮暂歇。`);
    foe.intent = pickIntent(foe, rng);
    return;
  }
  if (mv.cd) foe.cds[mv.name] = mv.cd;
  foe.zy -= enemyMoveCost(foe, mv);
  if (mv.kind === 'attack' || mv.kind === 'drain' || mv.kind === 'stun') {
    const evaded = speed > 0 && gs.player.speed + speed > foe.speed;
    const raw = Math.round(mv.power * (0.9 + rng() * 0.2) * (evaded ? 0.7 : 1));
    if (evaded) b.logs.push('你借身法避开锋芒，受到的打击减轻。');
    const absorbed = Math.min(b.meShield, raw);
    b.meShield -= absorbed;
    const dmg = raw - absorbed;
    gs.player.hp = Math.max(0, gs.player.hp - dmg);
    b.logs.push(`${foe.name}使出「${mv.name}」，${absorbed ? `护盾挡下 ${absorbed}，` : ''}造成 ${dmg} 点伤害。`);
    if (mv.kind === 'drain' && dmg > 0) {
      const heal = Math.round(dmg * 0.4);
      foe.hp = Math.min(foe.hpMax, foe.hp + heal);
      b.logs.push(`${foe.name}吸取气血，恢复 ${heal} 点。`);
    }
    if (mv.kind === 'stun' && rng() < 0.35) {
      b.playerStunned = true;
      b.logs.push('你心神受震，下回合只能调息稳神！');
    }
  } else if (mv.kind === 'shield') {
    foe.shield += mv.power;
    b.logs.push(`${foe.name}催动「${mv.name}」，周身浮现 ${mv.power} 点护盾。`);
  } else if (mv.kind === 'heal') {
    foe.hp = Math.min(foe.hpMax, foe.hp + mv.power);
    b.logs.push(`${foe.name}催动「${mv.name}」，气血恢复 ${mv.power} 点。`);
  }

  if (gs.player.hp <= 0) {
    if (foe.practice) {
      gs.player.hp = Math.max(10, Math.round(gs.player.hpMax * 0.2));
      b.state = 'lose';
      b.logs.push('切磋点到为止，你退后认输。');
    } else {
      b.state = 'lose';
      gs.player.dead = true;
      b.logs.push('你气血耗尽，倒在了血泊之中。');
    }
  } else {
    foe.intent = pickIntent(foe, rng);
  }
}

function dealDamageToFoe(b, rawDmg, pierce = 0) {
  const foe = b.foe;
  const blockable = Math.round(rawDmg * (1 - pierce));
  const absorbed = Math.min(foe.shield, blockable);
  foe.shield -= absorbed;
  const dmg = Math.min(foe.hp, rawDmg - absorbed);
  foe.hp = Math.max(0, foe.hp - dmg);
  return { dmg, absorbed };
}
function battleGuPlan(gs) {
  const { battle, player } = gs;
  const queue = battle.guQueue ?? [];
  const choices = player.equipped.flatMap((uid) => {
    const gu = player.gu.find((g) => g.uid === uid);
    const def = GU_DEFS[gu?.id];
    if (!def || !['攻击', '控制', '防御', '治疗', '增益', '探知', '隐匿'].includes(def.kind)) return [];
    return [{ uid, def, weak: isGuWeak(gu), cooldown: Math.max(0, (battle.cds[uid] ?? 0) - 1) }];
  });
  const queued = queue.map((uid) => choices.find((choice) => choice.uid === uid)).filter(Boolean);
  const cost = queued.reduce((total, choice) => total + choice.def.cost, 0);
  return { choices, queued, cost };
}

function applyBattleGu(gs, b, gu, rng) {
  const p = gs.player;
  const foe = b.foe;
  const { def } = gu;
  p.zy -= def.cost;
  if (def.cd) b.cds[gu.uid] = def.cd;
  if (def.kind === '攻击' || def.kind === '控制') {
    const boosted = def.school === '月道' && def.kind === '攻击' && b.meBoost > 0;
    const mul = boosted ? 1.35 : 1;
    if (boosted) b.meBoost--;
    const strengthBonus = def.school === '力道' ? p.powerBonus * 0.4 : 0;
    const raw = Math.round((def.power + strengthBonus) * mul * (0.92 + rng() * 0.16));
    const res = dealDamageToFoe(b, raw, def.id === 'yuehen' ? 0.5 : 0);
    b.logs.push(`你催动「${def.name}」，${res.absorbed ? `破盾 ${res.absorbed}，` : ''}造成 ${res.dmg} 点伤害。`);
    if (def.id === 'xuefu_gu' && res.dmg > 0) {
      const leach = Math.round(res.dmg * 0.35);
      p.hp = Math.min(p.hpMax, p.hp + leach);
      b.logs.push(`血蝠蛊反哺气血 +${leach}。`);
    }
    if ((def.kind === '控制' || def.id === 'dianlang_gu') && rng() < 0.35) {
      foe.stunned = true;
      b.logs.push(`${foe.name}行动受制，本轮无法出手！`);
    }
  } else if (def.kind === '防御') {
    b.meShield += def.power;
    b.logs.push(`你催动「${def.name}」，获得 ${def.power} 点护盾。`);
  } else if (def.kind === '治疗') {
    p.hp = Math.min(p.hpMax, p.hp + def.power);
    b.logs.push(`你催动「${def.name}」，气血恢复 +${def.power}。`);
  } else if (def.kind === '增益') {
    b.meBoost += 1;
    b.logs.push(`你催动「${def.name}」，下一记月道攻击蛊的威能大增！`);
  } else if (def.kind === '探知') {
    b.scouted = true;
    b.logs.push(`你催动「${def.name}」，看清了${foe.name}的气血真元与下步动向。`);
  } else if (def.kind === '隐匿') {
    b.meShield += Math.round(def.power * 0.6);
    b.logs.push(`你催动「${def.name}」隐去身形，获得 ${Math.round(def.power * 0.6)} 点护盾。`);
  }
}
function battleAct(gs, action, arg = '', rng = Math.random) {
  const b = gs.battle;
  if (!b || b.state !== 'ongoing') return b;
  const p = gs.player;
  const foe = b.foe;

  if (action === 'lethal') {
    if (b.lethal || foe.practice) return b;
    b.lethal = true;
    b.logs.push('你眼神转冷，彻底下了死手！此战不再留手，也再无退路。');
    return b;
  }

  if (b.playerStunned) {
    if (action !== 'recover') return b;
    b.playerStunned = false;
    b.guQueue = [];
    for (const k of Object.keys(b.cds)) {
      if (b.cds[k] > 0) b.cds[k]--;
    }
    b.logs.push('你强忍心神震荡，稳住气息。');
    enemyTurn(gs, b, rng);
    b.round++;
    if (b.logs.length > 24) b.logs = b.logs.slice(-24);
    return b;
  }

  const queue = (b.guQueue ??= []);
  if (action === 'gu') {
    const uid = Number(arg);
    const index = queue.indexOf(uid);
    if (index !== -1) {
      queue.splice(index, 1);
    } else {
      const { choices, cost } = battleGuPlan(gs);
      const choice = choices.find((entry) => entry.uid === uid);
      if (choice && !choice.cooldown && !choice.weak && cost + choice.def.cost <= p.zy) queue.push(uid);
    }
    return b;
  }

  const mv = action === 'move' ? p.moves.find((m) => m.id === arg) : null;
  const plan = action === 'resolveGu' ? battleGuPlan(gs) : null;
  if (plan) {
    if (!queue.length || plan.queued.length !== queue.length || plan.cost > p.zy
      || plan.queued.some((choice) => choice.cooldown || choice.weak)) return b;
    b.guQueue = [];
  } else {
    if (queue.length || !['attack', 'stone', 'flee', 'move'].includes(action)) return b;
    if (action === 'stone' && p.yuanshi < 2) return b;
    if (action === 'flee' && b.lethal) return b;
    if (action === 'move' && (!mv || killerMoveBlock(gs, mv) || (b.cds[mv.id] ?? 0) > 1 || p.zy < mv.cost)) return b;
  }

  for (const k of Object.keys(b.cds)) {
    if (b.cds[k] > 0) b.cds[k]--;
  }

  if (action === 'attack') {
    const raw = Math.round((8 + p.rank * 4 + (p.powerBonus || 0) * 0.6) * (0.9 + rng() * 0.2));
    const res = dealDamageToFoe(b, raw);
    b.logs.push(`你挥拳直击，${res.absorbed ? `削去护盾 ${res.absorbed}，` : ''}造成 ${res.dmg} 点伤害。`);
  } else if (action === 'stone') {
    p.yuanshi -= 2;
    const gain = Math.min(p.zyMax - p.zy, Math.max(10, Math.round(p.zyMax * 0.4)));
    p.zy += gain;
    b.logs.push(`你消耗 2 块元石补充真元，真元恢复 +${gain}。`);
  } else if (action === 'flee') {
    const speed = p.speed + (b.haste?.turns > 0 ? b.haste.speed : 0);
    const chance = 0.55 + (speed - foe.speed) * 0.04 + (hasGu(gs, 'yinshi') ? 0.25 : 0);
    if (rng() < Math.max(0.2, Math.min(0.95, chance))) {
      b.state = 'fled';
      b.logs.push('你虚晃一招，顺利脱离战局。');
      return b;
    }
    b.logs.push('你想脱身退走，却被对方死死缠住！');
  } else if (action === 'resolveGu') {
    const fired = [];
    for (const gu of plan.queued) {
      applyBattleGu(gs, b, gu, rng);
      fired.push(gu.def.id);
      if (foe.hp <= 0) break;
    }
    recordGuUsage(gs, fired);
  } else if (action === 'move') {
    const effect = killerEffects(mv);
    p.zy -= mv.cost;
    b.cds[mv.id] = mv.cd;
    if (effect.kind === '防御') {
      b.meShield += effect.power;
      b.logs.push(`你催动杀招「${mv.name}」，凝出 ${effect.power} 点厚盾！`);
    } else {
      const boosted = effect.moon && b.meBoost > 0;
      if (boosted) b.meBoost--;
      const removed = Math.min(foe.shield, effect.breakShield ?? 0);
      foe.shield -= removed;
      if (removed) b.logs.push(`冲撞击碎 ${removed} 点护盾。`);
      const power = effect.power + (effect.strength ?? 0) * p.powerBonus;
      const raw = Math.round(power * (boosted ? 1.35 : 1) * (0.94 + rng() * 0.14));
      const res = dealDamageToFoe(b, raw, effect.pierce);
      b.logs.push(`你催动杀招「${mv.name}」，${res.absorbed ? `破盾 ${res.absorbed}，` : ''}重创 ${foe.name} ${res.dmg} 点！`);
      if (effect.bonusShield) {
        b.meShield += effect.bonusShield;
        b.logs.push(`辅蛊护体，附加护盾 +${effect.bonusShield}。`);
      }
      if (effect.drain && res.dmg > 0) {
        const healed = Math.min(p.hpMax - p.hp, Math.round(res.dmg * effect.drain));
        p.hp += healed;
        if (healed) b.logs.push(`血蝠反哺，气血恢复 ${Math.round(healed)} 点。`);
      }
      if (foe.hp > 0 && effect.stun && rng() < effect.stun) {
        foe.stunned = true;
        b.logs.push(`${foe.name}被雷击麻痹。`);
      }
      if (effect.speed) {
        b.haste = { speed: effect.speed, turns: 2 };
        b.logs.push(`风势助身，身法 +${effect.speed}，持续两轮。`);
      }
    }
  }

  if (foe.hp <= 0) {
    b.state = 'win';
    recordQuestProgress(gs, 'victory', foe.id);
    if (foe.id === 'yezhu' || foe.id === 'zhuwang') recordFieldTrial(gs, 'won');
    const rw = foe.reward || {};
    const ys = (rw.yuanshi || 0) + (b.lethal ? 15 : 0);
    const rewards = [];
    if (ys > 0) {
      p.yuanshi += ys;
      rewards.push(`元石 ×${ys}`);
    }
    if (rw.item) {
      addItem(gs, rw.item, 1);
      rewards.push(`${ITEMS[rw.item].name} ×1`);
    }
    if (b.winFlag) gs.flags[b.winFlag] = true;
    if (b.winGu && addGu(gs, b.winGu)) rewards.push(`${GU_DEFS[b.winGu].name} ×1`);
    if (rw.gu && !hasGu(gs, rw.gu)) {
      addGu(gs, rw.gu);
      rewards.push(`${GU_DEFS[rw.gu].name} ×1`);
    }
    b.rewards = rewards;
    if (rewards.length) b.logs.push(`战利品：${rewards.join('、')}。`);
    if (b.lethal && !foe.practice) {
      p.mo += 18;

function placeMoveList(gs) {
  if (!PLACES[gs.location]) return [];
  const routes = new Map([[gs.location, { minutes: 0, blocked: '' }]]);
  const pending = new Set([gs.location]);

  while (pending.size) {
    const id = [...pending].reduce((nearest, candidate) => (
      routes.get(candidate).minutes < routes.get(nearest).minutes ? candidate : nearest
    ));
    pending.delete(id);
    const route = routes.get(id);
    if (route.blocked) continue;

    for (const [next, duration] of Object.entries(PLACES[id].links)) {
      const target = PLACES[next];
      if (!target || (target.hidden && !gs.flags[target.hidden])) continue;
      const minutes = route.minutes + duration;
      if (minutes >= (routes.get(next)?.minutes ?? Infinity)) continue;
      const blocked = target.lock && !gs.flags[target.lock.flag] ? target.lock.msg : '';
      routes.set(next, { minutes, blocked });

  if (!route) return { ok: false, reason: '此处无路可通' };

  if (gs.player.dead || gs.battle) return { ok: true };

    const gain = base * (spend / need) * sess.crackMult * (0.9 + rng() * 0.2);
    const hurtGain = key === 'hard' ? (7 + Math.floor(rng() * 5)) : (2 + Math.floor(rng() * 2));
    sess.zy = Math.max(0, sess.zy - spend);
    sess.crack = Math.min(100, sess.crack + gain);
    sess.hurt = Math.min(100, sess.hurt + hurtGain);
    msg = `${key === 'hard' ? '强行撞击' : '稳步冲击'}窍壁（真元 -${Math.round(spend)}），裂痕 +${gain.toFixed(1)}%，震伤 +${hurtGain}。`;
  } else if (key === 'stone') {
    if (sess.stones < stoneCost || sess.zy >= zyMax) return sess;

    sess.stones -= stoneCost;
    sess.stonesUsed += stoneCost;
    sess.zy += zyGain;

  sess.steps++;

    settleBreakSession(gs, sess, 'win');
    const before = { ...gs.player };
    gs.player.rank++;
    gs.player.xiao = 0;
    gs.player.xp = 0;
    recalcStats(gs);
    gs.player.zy = Math.round(gs.player.zyMax * 0.5);
    if (gs.player.rank >= 2) gs.flags['open:jiazhuge'] = true;
    sess.lines.push(msg, `轰然一声脆响，窍壁彻底碎裂，你晋入${realmText(gs.player)}！`);
    const growth = realmGrowthText(before, gs.player);

    addLog(gs, '【冲关受挫】震伤过重，退回养伤（已攒下冲关心得）。', 'log-bad');

  }

  const healed = Math.min(sess.crack, sess.wallHeal);
  sess.crack = Math.max(0, sess.crack - healed);
  sess.zy = Math.min(zyMax, sess.zy + Math.max(2, Math.round(zyMax * 0.06)));
  sess.lines.push(`${msg} 窍壁自愈 ${healed.toFixed(1)}%。`);
  if (sess.lines.length > 6) sess.lines = sess.lines.slice(-6);
  return sess;
}

    return globalThis.localStorage?.getItem(SFX_MUTE_KEY) === '1';
  } catch {
    return false;
  }
}
function toggleSfxMuted() {
  const next = !isSfxMuted();
  try {
    globalThis.localStorage?.setItem(SFX_MUTE_KEY, next ? '1' : '0');
  } catch {
    // 忽略隐私模式存储限制
  }
  return next;
}

let _audioCtx = null;
function getAudioCtx() {
  if (typeof window === 'undefined' || isSfxMuted()) return null;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!_audioCtx) _audioCtx = new Ctx();
  if (_audioCtx.state === 'suspended') _audioCtx.resume().catch(() => {});
  return _audioCtx;
}

function tone(freq, dur, type = 'sine', vol = 0.045, slideTo = null, delay = 0) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + dur);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  } catch {
    // 忽略音频上下文限制
  }
}
function playSfx(kind) {
  if (isSfxMuted() || typeof window === 'undefined') return;
  if (kind === 'tap') {
    tone(420, 0.055, 'triangle', 0.025, 240);
  } else if (kind === 'walk') {
    tone(190, 0.08, 'sine', 0.03, 130);
    tone(220, 0.08, 'sine', 0.022, 150, 0.09);
  } else if (kind === 'hit') {
    tone(145, 0.14, 'sawtooth', 0.045, 52);
    tone(95, 0.16, 'triangle', 0.05, 42, 0.02);
  } else if (kind === 'shield') {
    tone(330, 0.16, 'triangle', 0.035, 480);
    tone(520, 0.22, 'sine', 0.025, 440, 0.04);
  } else if (kind === 'heal') {
    tone(440, 0.18, 'sine', 0.03, 554);
    tone(660, 0.24, 'sine', 0.028, 880, 0.08);
  } else if (kind === 'refine') {
    tone(280, 0.15, 'triangle', 0.035, 360);
    tone(540, 0.22, 'sine', 0.025, 680, 0.07);
  } else if (kind === 'win' || kind === 'break') {
    tone(392, 0.18, 'triangle', 0.04, 440);
    tone(523, 0.22, 'triangle', 0.04, 587, 0.1);
    tone(784, 0.36, 'sine', 0.04, 784, 0.2);
  } else if (kind === 'alert') {
    tone(240, 0.18, 'sawtooth', 0.03, 160);
  }
}

function renderGoalShortcut(gs, goal) {
  if (gs.battle || gs.player.dead || gs.pendingEventId || gs.refining || gs.breakthrough) return '';
  if (goal.tab) return `<button class="sm gold" data-action="navTab" data-tab="${esc(goal.tab)}">${esc(goal.label ?? '前往修行')}</button>`;
  if (!goal.place) return '';
  const name = PLACES[goal.place].name;
  if (gs.location === goal.place) {
    return gs.modal?.kind === 'place' ? '' : `<button class="sm gold" data-action="openPlace">查看${esc(name)}</button>`;
  }
  const route = placeMoveList(gs).find(({ id }) => id === goal.place);
  if (!route || route.blocked) return `<small>${esc(route?.blocked || '此处无路可通')}</small>`;
  return `<button class="sm gold" data-action="walkTo" data-id="${goal.place}">前往${esc(name)} · ${formatDuration(route.minutes)}</button>`;
}
function renderCultivationView(gs, goal) {

function renderRefineFurnace(sess, effect) {
  const { state, flow, progress, pressure, success } = sess;
  const canTime = state === 'ongoing' && (sess.pending.length || sess.turns);
  const formed = progress >= flow.target;
  const hot = pressure > flow.safePressure;
  const status = state === 'ready' ? '炉火未点'
    : state === 'ongoing' ? sess.pending.length ? '待火星落入炉心，依次投入蛊虫与蛊材'
      : formed && !hot ? '蛊影已凝实，可合盖收炉'
      : !sess.turns ? '炉火将尽，须决断收炉或撤火'
      : hot ? '炉压过盛，可掀盖泄火' : '观炉心火候，适时鼓风或温养'
    : success ? `炼成 · ${sess.outName}`
    : state === 'aborted' ? '已撤火停炉'
    : pressure >= OVERLOAD_PRESSURE ? '炉炸火散' : '合炼未成';
  const outcome = state === 'done' ? (success ? 'success' : 'failure') : state;
  const shapeRatio = Math.min(1, progress / flow.target);
  return `<div class="refine-stage" data-state="${outcome}" data-effect="${effect?.action ?? ''}" data-hot="${hot}" style="--heat:${Math.min(1, pressure / OVERLOAD_PRESSURE)};--shape:${shapeRatio}">
      <div class="refine-scene" aria-hidden="true">
        ${renderFurnaceCauldronSvg(outcome, hot, shapeRatio, effect?.action)}
        ${effect?.input ? `<div class="refine-drop">${esc(effect.input)}</div>` : ''}
      </div>
      ${canTime ? '<div class="refine-timing" aria-hidden="true"><i></i></div>' : ''}
      <div class="refine-status" role="status">${esc(status)}</div>
      ${state === 'ongoing' && effect?.action !== 'ignite' && sess.lines.length ? `<div class="refine-feedback">${esc(sess.lines.at(-1))}</div>` : ''}
    </div>`;
}
function renderRefineModal(sess, effect) {
  const scene = `<h2 id="refine-title">${esc(sess.method)} · ${esc(sess.outName)}</h2>${renderRefineFurnace(sess, effect)}`;
  if (sess.state === 'ready') return `${scene}
    ${renderRefineRequirements(sess.materials, sess.cost, sess.baseRate, sess.realmBonus ?? 0)}
    <div class="row">
      <button class="primary" data-action="refineAct" data-id="ignite">点炉起火</button>
      <button class="ghost" data-action="closeModal">罢手</button>

  if (sess.state !== 'ongoing') return `${scene}
    <div class="muted">${sess.lines.slice(-1).map((line) => esc(line)).join('')}</div>

  if (sess.pending.length) return `<div class="refine-ritual">${scene}

    <div><button class="ghost" data-action="refineAct" data-id="abort">撤火</button></div>
  </div>`;

  const chance = refineChance(sess);

  return `<div class="refine-ritual">${scene}
    <div class="row">
      ${sess.turns && !ready ? '<button class="gold" data-action="refineAct" data-id="pulse">按下风箱</button>' : ''}
      ${sess.turns && !ready ? '<button data-action="refineAct" data-id="gentle">温养</button>' : ''}
      ${techniques.some(({ id, enabled }) => id === 'vent' && enabled) && !ready ? '<button data-action="refineAct" data-id="vent">掀盖放火</button>' : ''}
      ${signature && !ready ? `<button data-action="refineAct" data-id="signature">${esc(signature.name)}</button>` : ''}
      ${protectables.map((gu) => `<button class="sm" data-action="refineAct" data-id="protect:${gu.uid}">护蛊印 · ${esc(gu.name)}</button>`).join('')}
      ${chance ? `<button class="${ready ? 'primary' : 'blood'}" data-action="refineAct" data-id="seal">${ready ? '合盖收炉' : '冒险合盖'} · ${Math.round(chance * 100)}%</button>` : ''}
      <button class="ghost" data-action="refineAct" data-id="abort">撤火</button>
    </div>
    ${protectedGu ? `<div class="muted" style="font-size:.82rem">已施护蛊印：失败或炸炉时保住「${esc(protectedGu.name)}」</div>` : ''}
  </div>`;
}

function guShortStat(def) {
  if (def.kind === '攻击') return `伤 ${def.power}`;
  if (def.kind === '控制') return `控 ${def.power}`;
  if (def.kind === '防御') return `盾 ${def.power}`;
  if (def.kind === '隐匿') return `盾 ${Math.round(def.power * 0.6)}`;
  if (def.kind === '治疗') return `疗 ${def.power}`;
  if (def.kind === '增益') return '月+35%';
  if (def.kind === '探知') return '探情';
  return '';
}
function renderBattleView(gs, battleFx) {
  const b = gs.battle;
  const p = gs.player;
  const foe = b.foe;
  const hpRatio = foe.hpMax ? Math.max(0, foe.hp / foe.hpMax) : 0;
  const hpState = hpRatio > 0.6 ? '气息强盛' : hpRatio > 0.25 ? '已有伤势' : '摇摇欲坠';
  const hpLevel = hpRatio > 0.6 ? 'high' : hpRatio > 0.25 ? 'mid' : 'low';
  const foeHp = b.scouted
    ? `<div class="foe-hp"><span class="bar hp"><i style="width:${Math.round(hpRatio * 100)}%"></i></span><span>${foe.hp} / ${foe.hpMax}</span><span class="foe-zy">真元 ${foe.zy}/${foe.zyMax}</span></div>`
    : `<div class="foe-hp is-${hpLevel}">气机 · ${hpState}</div>`;
  const intentBadge = foe.stunned ? '受制' : !b.scouted ? '未知' : {
    attack: '攻伐',
    drain: '噬血',
    stun: '震神',
    shield: '结盾',
    heal: '回气'
  }[foe.intent?.kind] || '暂歇';
  const intentText = foe.stunned
    ? '本轮受制，无法出手'
    : b.scouted && foe.intent
      ? `${foe.intent.name}（${foe.intent.kind === 'shield' ? `护盾 ${foe.intent.power}` : foe.intent.kind === 'heal' ? `回血 ${foe.intent.power}` : `威能约 ${foe.intent.power}`}）`
      : b.scouted ? '暂歇调息' : '气机晦暗（念息蛊可探明）';

  const fxFresh = battleFx && (Date.now() - battleFx.ts) < 1600;
  const foeHitCls = fxFresh && battleFx.foeDmg > 0 ? ' is-struck' : '';
  const fxPop = fxFresh ? [
    battleFx.foeDmg > 0 ? `<span class="fx-pop is-dmg">−${battleFx.foeDmg}</span>` : '',
    battleFx.foeShieldGain > 0 ? `<span class="fx-pop is-shield">+${battleFx.foeShieldGain} 盾</span>` : '',

  const { choices, queued, cost } = battleGuPlan(gs);
  const hasQueue = queued.length > 0;
  const guButtons = choices.map(({ uid, def, weak, cooldown }) => {
    const position = queued.findIndex((choice) => choice.uid === uid) + 1;
    const selected = position > 0;

    const stat = guShortStat(def);
    return `<button class="skill${selected ? ' is-picked' : ''}" aria-pressed="${selected}" title="${esc(weak ? '饥饿虚弱，喂食后方可催动' : guEffectText(def))}" ${disabled ? 'disabled' : ''} data-action="battleAct" data-kind="gu" data-id="${uid}">

    return `<button class="skill is-move" ${disabled ? 'disabled' : ''} title="${esc(blocked || killerEffectText(m))}" data-action="battleAct" data-kind="move" data-id="${esc(m.id)}">

        ${guButtons ? `<div class="skill-group">
          <div class="skill-head">
            <span>空窍蛊虫</span>
            <span class="skill-plan">${hasQueue ? `催动序：${queued.map(({ def }) => esc(def.name)).join(' → ')} · 耗 ${cost} 真元` : ''}</span>
          </div>
          <div class="skill-list">${guButtons}</div>
          <button class="primary battle-go" ${hasQueue ? '' : 'disabled'} data-action="battleAct" data-kind="resolveGu">催动蛊虫</button>
        </div>` : ''}
        ${moveButtons ? `<div class="skill-group">
          <div class="skill-head"><span>自创杀招</span></div>
          <div class="skill-list">${moveButtons}</div>
        </div>` : ''}
        <div class="battle-basic">
          <button class="sm ghost" ${hasQueue ? 'disabled' : ''} data-action="battleAct" data-kind="attack">拳脚试探</button>
          <button class="sm ghost" ${hasQueue || p.yuanshi < 2 ? 'disabled' : ''} data-action="battleAct" data-kind="stone">碎元石回元 · 2石</button>
          <span class="battle-spacer"></span>
          ${b.lethal
            ? '<span class="battle-lethal">死斗中 · 不退半步</span>'
            : `<button class="sm ghost" ${hasQueue ? 'disabled' : ''} data-action="battleAct" data-kind="flee">脱身</button>
               ${foe.practice ? '' : '<button class="sm blood" data-action="battleAct" data-kind="lethal">下死手</button>'}`}
        </div>
      </section>`;
  }

function renderMapPanel(gs, title = '青茅山舆图') {
  const moves = placeMoveList(gs);
  const moveMap = Object.fromEntries(moves.map((m) => [m.id, m]));
  const visibleIds = Object.keys(PLACES).filter((id) => !PLACES[id].hidden || gs.flags[PLACES[id].hidden]);
  const drawn = {};
  let edges = '', nodes = '';

  for (const pid of visibleIds) {
    const place = PLACES[pid];
    for (const tid of Object.keys(place.links || {})) {
      if (!PLACES[tid] || (PLACES[tid].hidden && !gs.flags[PLACES[tid].hidden])) continue;
      const key = pid < tid ? `${pid}|${tid}` : `${tid}|${pid}`;
      if (drawn[key]) continue;
      drawn[key] = true;
      const target = PLACES[tid];
      const active = pid === gs.location || tid === gs.location;
      const other = pid === gs.location ? tid : pid;
      const cls = active ? (moveMap[other]?.blocked ? 'map-edge is-blocked' : 'map-edge is-active') : 'map-edge';
      edges += `<line class="${cls}" x1="${place.x}" y1="${place.y}" x2="${target.x}" y2="${target.y}"/>`;
    }

    const mv = moveMap[pid];
    const style = `left:${place.x}%;top:${place.y}%`;
    if (pid === gs.location) {
      const label = `<b>${esc(place.name)}</b><small>身处此地</small>`;
      nodes += hasPlaceActions(gs)
        ? `<button type="button" class="map-node is-here" style="${style}" data-action="openPlace">${label}</button>`
        : `<div class="map-node is-here" style="${style}">${label}</div>`;
    } else if (mv) {
      nodes += `<button type="button" class="map-node is-move" style="${style}" data-action="walkTo" data-id="${pid}" ${mv.blocked ? 'disabled title="' + esc(mv.blocked) + '"' : ''}>
        <b>${esc(place.name)}</b><small>${esc(mv.blocked ? '受阻' : formatDuration(mv.minutes))}</small>
      </button>`;
    } else {
      nodes += `<div class="map-node is-far" style="${style}"><b>${esc(place.name)}</b></div>`;
    }
  }

  const directory = visibleIds.map((id) => {
    const place = PLACES[id];
    const blocked = id === gs.location ? '' : moveMap[id]?.blocked || (!moveMap[id] ? place.lock?.msg || '当前没有通路' : '');
    return `<details><summary>${esc(place.name)} · ${blocked ? '受阻' : '开放'}</summary>
      <p>${esc(isNight(gs.minutes) ? place.night : place.day)}</p>
      ${renderExpeditionDetails(gs, place, blocked)}
      ${!blocked && id !== gs.location ? `<button class="sm gold" data-action="walkTo" data-id="${id}">前往 · ${formatDuration(moveMap[id].minutes)}</button>` : ''}
    </details>`;
  }).join('');

  const blockedHints = moves.filter((m) => m.blocked).map((m) => `<div>· ${esc(m.name)}：${esc(m.blocked)}</div>`).join('');

  return `<div class="map-sheet-wrap">
    <div class="list-head">
      <h3>${esc(title)}</h3>
      <span class="muted">南疆 · 青茅山疆域</span>
    </div>
    <div class="map-scroll">
      <div class="map-canvas ${isNight(gs.minutes) ? 'is-night' : ''}">
        <svg class="map-terrain" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <!-- 山寨疆界与青茅等高线 -->
          <path d="M4,8 Q32,4 58,14 L60,88 Q28,94 4,88 Z" fill="rgba(41, 69, 58, 0.14)" stroke="rgba(196, 168, 108, 0.2)" stroke-width="0.35" stroke-dasharray="1.5 1.2"/>
          <path d="M62,10 Q80,6 96,22 Q98,62 90,92 Q74,95 62,80 Z" fill="rgba(22, 36, 32, 0.35)" stroke="rgba(92, 163, 136, 0.14)" stroke-width="0.3"/>
          <path d="M64,55 Q74,64 82,78 T95,94" fill="none" stroke="rgba(82, 145, 168, 0.32)" stroke-width="0.7"/>
          <path d="M66,18 Q76,12 88,26" fill="none" stroke="rgba(196, 168, 108, 0.12)" stroke-width="0.3"/>
          <path d="M12,34 Q24,28 38,38" fill="none" stroke="rgba(196, 168, 108, 0.12)" stroke-width="0.3"/>
          <text x="8" y="94" font-size="3.2" fill="rgba(207, 169, 104, 0.45)" font-family="serif">古月山寨</text>
          <text x="72" y="94" font-size="3.2" fill="rgba(140, 150, 142, 0.5)" font-family="serif">十万大山外缘</text>
          ${edges}
        </svg>
        ${nodes}
      </div>
    </div>
    <div class="map-legend">
      <span><i class="dot-here"></i>当前所在</span>
      <span><i class="dot-move"></i>可启程前往</span>
      <span><i class="dot-lock"></i>前路受阻</span>
    </div>
    ${blockedHints ? `<div class="map-blocked">${blockedHints}</div>` : ''}
    <section class="card"><h3>地点志</h3>${directory}</section>
  </div>`;
}

function renderApertureView(gs) {
  const p = gs.player;
  const needXp = minorXpNeed(p);
  const xpPct = needXp ? Math.min(100, Math.round(p.xp / needXp * 100)) : 100;

  const chips = p.gu.map((g) => {
    const def = GU_DEFS[g.id];
    if (!def) return '';
    const isBm = p.benming === g.uid;
    return `<span class="gu-chip ${g.satiety <= 20 || isGuWeak(g) ? 'weak' : ''}">${isBm ? '★ ' : ''}${esc(def.name)} <small>${isGuWeak(g) ? '虚弱' : `${g.satiety}%`}</small></span>`;
  }).join('');

  const svgGuData = p.gu.map((g) => ({ uid: g.uid, weak: isGuWeak(g) || g.satiety <= 20 }));

  const order = (g) => (p.benming === g.uid ? 0 : 2) + (p.equipped.includes(g.uid) ? 0 : 1);
  const sortedGu = p.gu
    .map((g, i) => ({ g, i }))
    .sort((a, b) => order(a.g) - order(b.g)
      || (GU_DEFS[b.g.id]?.rank ?? 0) - (GU_DEFS[a.g.id]?.rank ?? 0)
      || a.i - b.i)
    .map(({ g }) => g);
  const equippedGu = p.gu.filter((g) => p.equipped.includes(g.uid));
  const equippedCount = equippedGu.length;

  const slotHtml = Array.from({ length: 6 }, (_, idx) => {
    const gu = equippedGu[idx];
    if (!gu) return '<span class="slot-pill is-empty">空位</span>';
    const def = GU_DEFS[gu.id];
    const weak = isGuWeak(gu);
    return `<span class="slot-pill${weak ? ' is-weak' : ''}">${p.benming === gu.uid ? '★ ' : ''}${esc(def?.name || '未知')}</span>`;
  }).join('');

  const guRows = sortedGu.map((g) => {
    const def = GU_DEFS[g.id];
    if (!def) return '';

const EQUIP_KINDS = ['攻击', '防御', '治疗', '增益', '控制', '探知', '隐匿'];

function guStats(def) {
  const main = {
    攻击: `伤害 ${def.power}`,
    控制: `伤害 ${def.power}`,
    防御: `护盾 ${def.power}`,
    隐匿: `护盾 ${Math.round(def.power * 0.6)}`,
    治疗: `回血 ${def.power}`,
    增益: '月道攻伐 +35%',
    探知: '看破敌情'
  }[def.kind];
  if (!main) return [];
  const stats = [main];
  if (def.kind === '控制' || def.id === 'dianlang_gu') stats.push('35% 震慑打断');
  if (def.id === 'xuefu_gu') stats.push('吸血 35%');
  if (def.id === 'yuehen') stats.push('穿半盾');
  stats.push(`耗真元 ${def.cost}`);
  const wait = Math.max(0, def.cd - 1);
  if (wait) stats.push(`冷却 ${wait} 回合`);
  return stats;
}

function renderRefineView(gs) {
  const realm = refineRealm(gs.player);
  const known = REFINE_RECIPES.filter((r) => knowsRefineRecipe(gs, r)).map((r) => {
    const check = canStartRefine(gs, r.id);
    return { r, ok: check.ok, reason: check.reason };
  });
  known.sort((a, b) => Number(b.ok) - Number(a.ok));

  const rows = known.map(({ r, ok, reason }) => {
    const out = GU_DEFS[r.out] || ITEMS[r.out];
    const rate = Math.round(refineSuccessRate(r.rate, realm.bonus, true) * 100);
    const parts = [
      ...Object.entries(r.gu).map(([id, count]) => {
        const have = gs.player.gu.filter((g) => g.id === id).length;
        const name = `${GU_DEFS[id].name}${count > 1 ? ` ×${count}` : ''}`;
        return `<span class="${have >= count ? '' : 'is-lack'}">${esc(name)}</span>`;
      }),
      ...Object.entries(r.materials).map(([id, count]) => {
        const have = gs.player.items[id] || 0;
        const name = `${ITEMS[id].name}${count > 1 ? ` ×${count}` : ''}`;
        return `<span class="${have >= count ? '' : 'is-lack'}">${esc(name)}</span>`;
      })
    ].join('<span> + </span>');

    return `<li class="list-row${ok ? ' is-ready' : ''}">
      <div class="list-main">
        <div class="list-title">
          <b>${esc(recipeOutputText(r))}</b>
          <span class="list-meta">${out.rank ? `${out.rank}转 · ` : ''}${r.method ?? '合炼'}</span>
        </div>
        <div class="list-sub">${parts}</div>
      </div>
      <div class="list-side">
        <span class="list-note" title="${esc(reason || '材料齐备，可立即开炉')}">成算 ${rate}% · ${r.cost} 元石</span>
        <button class="sm ${ok ? 'primary' : 'ghost'}" data-action="startRefine" data-id="${r.id}">${ok ? '开炉' : '缺料'}</button>
      </div>
    </li>`;
  }).join('');

  const unknown = REFINE_RECIPES.filter((recipe) => !knowsRefineRecipe(gs, recipe))
    .map((recipe) => `<li>${esc(recipeOutputText(recipe))} · ${esc(recipeOrigin(recipe))}</li>`).join('');

  return `<div class="card">
      <div class="list-head">
        <h3>炼蛊</h3>
        <span class="muted">炼道 · ${realm.name}（心得 ${realm.insight}${realm.next ? ` / ${realm.next}` : ''}）</span>
      </div>
      ${rows ? `<ul class="list-rows">${rows}</ul>` : '<div class="muted">尚未习得蛊方。</div>'}
    </div>${unknown ? `<section class="card"><details><summary>未习得蛊方的来源</summary><ul>${unknown}</ul></details></section>` : ''}`;
}
function renderRefineRequirements(materials, cost, rate, bonus) {
  return `<div class="muted">${esc(materials)}<br>开炉 ${cost} 元石 · 稳炉成算 ${Math.round(refineSuccessRate(rate, bonus, true) * 100)}%</div>`;

const PROFILE_ARCS = {
  mobei: { meetings: ['classmates', 'mobei_roster'], closer: 'mobei_watch', finale: 'mobei_wall' },
  chicheng: { meetings: ['classmates', 'chi_delivery'], closer: 'chi_quota', finale: 'chi_guarantee' },
  bainingbing: { meetings: ['bai_encounter', 'bai_footprints', 'three_clans'], closer: 'bai_after_spar', finale: 'bai_broken_flag' }
};

function characterProfileLevel(gs, id) {
  const seen = (eventId) => Boolean(gs.story.history[eventId] || gs.flags[`event_done:${eventId}`]);
  const arc = PROFILE_ARCS[id];
  if (arc) {
    if (seen(arc.finale)) return 3;
    if (seen(arc.closer)) return 2;
    return arc.meetings.some(seen) ? 1 : 0;
  }
  if (id === 'jiafu') {
    if (seen('jia_questions') || seen('jia_private_ledger')) {
      if (seen('jia_case_followup') && gs.story.quests.caravan?.outcome === 'jia') return 3;
      if (seen('jia_private_ledger')) return 2;
      return 1;
    }
    return 0;
  }
  if (!seen('tie_inquiry')) return 0;
  if (gs.flags.jia_iron_review && gs.flags.tie_cleared) return 3;
  if (gs.flags.jia_iron_review) return 2;
  const hearing = STORY_EVENTS.find((event) => event.id === 'tie_inquiry');
  const choice = hearing.choices[gs.story.history.tie_inquiry?.choice];
  const workedTogether = choice?.effects.some((effect) => effect.startsWith(`relation:${id}:`));
  return workedTogether ? 2 : 1;
}

function renderStoryJournal(gs) {
  const { quests, history } = gs.story;
  const events = STORY_EVENTS.filter((event) => history[event.id] || gs.flags[`event_done:${event.id}`]);
  events.reverse().sort((a, b) => (history[b.id]?.minute ?? -1) - (history[a.id]?.minute ?? -1));
  const latestMain = events.find((event) => !event.quest && !event.person && !event.ambient);
  const chapter = gs.player.escapedMountain ? '卷一已结束' : '卷一 · 青茅山';
  const guide = mainGrowthGoal(gs);
  const main = mainStoryGoal(gs);
  const records = events
    .map((event) => {
      const entry = history[event.id];
      const choice = event.choices[entry?.choice]?.text;
      const feedback = Array.isArray(entry?.feedback) ? entry.feedback : [];
      return `<div class="ledger-item">
        <div class="ledger-head"><b>${esc(event.title)}</b><span class="muted">${Number.isFinite(entry?.minute) ? esc(formatDateTime(entry.minute)) : '旧档记录'}</span></div>
        ${choice ? `<div class="ledger-choice">抉择：${esc(choice)}</div>` : ''}
        ${feedback.length ? `<div class="ledger-sub">${feedback.map((line) => `<span>· ${esc(line)}</span>`).join('')}</div>` : ''}
      </div>`;
    }).join('');
  const people = Object.entries(STORY_CHARACTERS).map(([id, person]) => {
    const level = characterProfileLevel(gs, id);
    if (!level) return '<div class="dossier-locked">未知人物</div>';
    const { favor, trust, progress } = storyRelation(gs, id);
    const introduction = id === 'bainingbing' && level === 1 ? '白家寨蛊师' : person.identity;
    return `<details class="dossier-card">
      <summary><span>${esc(person.name)}</span><small>好感 ${favor} · 信任 ${trust}</small></summary>
      <div class="dossier-body">
        <p>${esc(introduction)}。</p>
        ${level >= 2 ? `<p>${esc(person.voice)}</p>
        <p><b>目标</b> · ${esc(person.goal)}</p>
        <p><b>往来</b> · ${esc(progress || '尚无记录')}</p>` : ''}
        ${level === 3 ? `<p><b>利益</b> · ${esc(person.interest)}</p>
        <p class="muted">${esc(person.change)}</p>` : ''}
      </div>
    </details>`;
  }).join('');
  const clueList = [];
  const tasks = Object.entries(quests).map(([id, progress]) => {
    const quest = STORY_QUESTS[id];
    for (const clueId of progress.clues) {
      const { name, detail } = quest.clues[clueId];
      clueList.push(`<div class="ledger-item"><b>${esc(name)}</b><div class="muted">${esc(detail)}</div></div>`);
    }
    const awaiting = progress.followupAt && !gs.flags[`event_done:${quest.followupEvent}`];
    const step = quest.steps[progress.stage];
    return `<div class="ledger-item">
      <div class="ledger-head"><b>${esc(quest.name)}</b><span class="badge">${esc(step?.name || STORY_QUEST_STAGES[progress.stage])}</span></div>
      <div class="muted">${esc(step?.hint || quest.outcomes[progress.outcome] || '')}</div>
      ${awaiting ? `<div class="list-hint">最早回信 · ${esc(formatDateTime(progress.followupAt))}</div>` : ''}
    </div>`;
  }).join('');
  if (gs.flags['clue:huajiu']) clueList.push('<div class="ledger-item"><b>花酒行者的旧事</b><div class="muted">从血蝠洞沿下游走，水帘后有暗涧遗洞。</div></div>');
  return `<section class="card">
      <h3>成长引导</h3>
      <p>${esc(guide.text)}</p>${renderGoalShortcut(gs, guide)}
    </section>
    <section class="card">
      <h3>主线 · ${chapter}</h3>
      ${!gs.player.escapedMountain && main.text !== guide.text ? `<p>${esc(main.text)}</p>${renderGoalShortcut(gs, main)}` : ''}
      ${latestMain ? `<p class="muted">最近的主线进展 · ${esc(latestMain.title)}</p>` : ''}
    </section>
    <section class="card">
      <h3>支线任务</h3>
      ${tasks ? `<div class="ledger-list">${tasks}</div>` : '<p class="muted">暂无支线记录。</p>'}
    </section>
    <section class="card">
      <h3>已获得的线索</h3>
      ${clueList.length ? `<div class="ledger-list">${clueList.join('')}</div>` : '<p class="muted">尚未记录线索。</p>'}
    </section>
    <section class="card"><h3>人物关系</h3><div class="dossier-list">${people}</div></section>
    <section class="card">
      <h3>重要剧情</h3>
      ${records ? `<div class="ledger-list">${records}</div>` : '<p class="muted">尚未记录重要剧情。</p>'}
    </section>`;
}

function updateLiveDisplay(ui) {

    xp: `修为 ${Math.floor(p.xp)} / ${need}`
  };

    'xp-bar': need ? p.xp / need : 1

    if (Object.hasOwn(labels, key) && node.textContent !== labels[key]) node.textContent = labels[key];

const FIELD_GATHER_TICKS = MIN_PER_SHICHEN / MIN_PER_KE;
function tickFieldGather(ui) {

  const gs = ui.game;

  if (session.location !== gs.location || gs.pendingEventId || gs.battle || gs.player.dead) {
    ui.modal = null;

  if (--session.ticks > 0) return false;
  const result = performPlaceAction(gs, session.action ?? 'gather');
  if (result?.item) {
    session.items[result.item] = (session.items[result.item] ?? 0) + result.count;

    ui.modal = null;

function startGameLoop(ui, render) {
  return setInterval(() => {
    if (ui.modal?.kind === 'expedition' && ui.modal.data.gathering) {
      if (tickFieldGather(ui)) render();
      else {
        const countdown = document.querySelector('[data-gather-ticks]');

      }
      return;

    if (!ui.game || ui.game.paused || ui.game.player.dead || ui.game.battle || ui.game.pendingEventId || ui.modal) return;
    const day = Math.floor(ui.game.minutes / MIN_PER_DAY);

    const goal = mainGrowthGoal(ui.game).text;
    advanceMinutes(ui.game, 15);

    if (ui.game.pendingEventId) saveGame(ui.game);
    if (ui.game.player.dead) {
      setModal(ui, 'dead', {});

    } else if (ui.game.battle || ui.game.pendingEventId || day !== Math.floor(ui.game.minutes / MIN_PER_DAY)
