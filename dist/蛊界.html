<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1917">
  <title>蛊界 · 青茅山篇</title>
  <style>
:root {
  --bg: #0c1715;
  --bg2: #122320;
  --card: #162b27;
  --card2: #1c3530;
  --line: #294942;
  --ink: #ebe7dc;
  --dim: #9ab0a8;
  --jade: #72c4a3;
  --gold: #d8bf87;
  --blood: #e07a6b;
  --warn: #e3a857;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.55;
  min-height: 100%;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card2);
  border-radius: 8px;
  padding: 8px 14px;
  min-height: 40px;
  transition: background .15s, border-color .15s, transform .1s;
}
button:hover:not(:disabled) { background: #23433d; border-color: var(--jade); }
button:disabled { opacity: .48; cursor: not-allowed; }
button.primary { background: #1e4d3f; border-color: var(--jade); color: #f4f9f6; font-weight: 600; }
button.gold { background: #3e341f; border-color: var(--gold); color: #f6e9c8; font-weight: 600; }
button.blood { background: #4a2320; border-color: var(--blood); color: #fde4e0; font-weight: 600; }
button.ghost { background: transparent; }
button.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }

.shell {
  max-width: 960px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 74px;
}

/* 顶部在场状态栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 23, 21, .95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.top-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top-id strong { font-size: 1.05rem; color: var(--gold); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: .78rem;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--dim);
}
.badge.jade { border-color: var(--jade); color: var(--jade); }
.badge.gold { border-color: var(--gold); color: var(--gold); }
.badge.blood { border-color: var(--blood); color: var(--blood); }

.clock-box { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--dim); }
.goal-bar {
  background: rgba(216, 191, 135, .1);
  border-left: 3px solid var(--gold);
  padding: 5px 10px;
  font-size: .88rem;
  color: #efe3c4;
  border-radius: 0 6px 6px 0;
}
.res-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.res-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.res-head { display: flex; justify-content: space-between; font-size: .78rem; color: var(--dim); margin-bottom: 3px; }
.bar { height: 6px; background: #0c1513; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--jade); transition: width .2s; }
.bar.hp > i { background: #d46b5e; }
.bar.zy > i { background: #5da9c4; }

/* 主内容区 */
.main { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.card h2, .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--gold); }
.muted { color: var(--dim); font-size: .88rem; }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

/* 场景舞台 + 昼夜氛围 */
.stage {
  background: linear-gradient(155deg, #18322c, #10201d);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.stage.is-night {
  background: linear-gradient(155deg, #101b24, #0b1318);
  border-color: #263847;
}
.stage-loc { font-size: .84rem; color: var(--gold); margin-bottom: 4px; }
.stage h1 { margin: 0 0 8px; font-size: 1.65rem; font-family: Georgia, "Songti SC", serif; }
.stage-desc { margin: 0 0 14px; color: #ddd8ca; }

/* 山野舆图 */
.map-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #101d1a; }
.map-canvas {
  position: relative;
  min-width: 600px;
  height: 340px;
  background:
    radial-gradient(circle at 28% 45%, rgba(114, 196, 163, .10), transparent 50%),
    radial-gradient(circle at 80% 72%, rgba(216, 191, 135, .08), transparent 40%);
}
.map-canvas.is-night {
  background:
    radial-gradient(circle at 28% 45%, rgba(90, 140, 160, .10), transparent 50%),
    radial-gradient(circle at 80% 72%, rgba(150, 130, 90, .06), transparent 40%);
}
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-edge { stroke: #31524a; stroke-width: .6; stroke-dasharray: 1.4 1.2; opacity: .65; }
.map-edge.is-active { stroke: var(--jade); stroke-width: .95; stroke-dasharray: none; opacity: .95; }
.map-edge.is-blocked { stroke: var(--warn); stroke-width: .75; stroke-dasharray: 1.2 1.2; opacity: .8; }
.map-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
  min-height: 0;
  padding: 5px 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg2);
  font-size: .8rem;
  line-height: 1.2;
  white-space: nowrap;
  z-index: 1;
}
.map-node small { font-size: .7rem; color: var(--dim); margin-top: 2px; }
.map-node.is-here { border-color: var(--jade); background: #1d4238; box-shadow: 0 0 0 2px rgba(114, 196, 163, .25); z-index: 2; }
.map-node.is-here small { color: var(--jade); font-weight: 600; }
.map-node.is-move { border-color: var(--gold); z-index: 2; }
.map-node.is-move:hover:not(:disabled) { background: #26483e; transform: translate(-50%, -53%); }
.map-node.is-far { opacity: .52; }

/* 空窍画布 */
.aperture-canvas {
  position: relative;
  height: 150px;
  border-radius: 10px;
  border: 1px solid #2b5452;
  background: radial-gradient(circle at 50% 65%, rgba(93, 169, 196, .28), rgba(16, 40, 44, .95) 70%);
  overflow: hidden;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.aperture-gu-list { display: flex; flex-wrap: wrap; gap: 6px; z-index: 1; }
.gu-chip {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .82rem;
  background: rgba(12, 23, 21, .8);
  border: 1px solid var(--jade);
}
.gu-chip.weak { border-color: var(--blood); color: var(--blood); }

/* 底部导航 */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: rgba(12, 23, 21, .97);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 6px 8px;
}
.nav button {
  min-height: 46px;
  padding: 4px 2px;
  font-size: .82rem;
  border-radius: 8px;
  background: transparent;
  border-color: transparent;
}
.nav button.on { background: var(--card2); border-color: var(--jade); color: var(--jade); font-weight: 600; }

/* 弹窗 & Toast */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(5, 10, 9, .78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal[hidden] { display: none; }
.sheet {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.place-sheet {
  width: min(860px, 100%);
}
.place-sheet-controls {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  justify-content: flex-end;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 76px;
  transform: translateX(-50%);
  z-index: 60;
  background: #203d36;
  border: 1px solid var(--jade);
  color: var(--ink);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: .88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }

.loglist { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; font-size: .86rem; }
.log-good { color: var(--jade); }
.log-bad { color: var(--blood); }
.log-warn { color: var(--warn); }
.log-gold { color: var(--gold); font-weight: 600; }
.intent-box {
  background: rgba(224, 122, 107, .1);
  border: 1px solid rgba(224, 122, 107, .35);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: .86rem;
}
input[type="text"], textarea {
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font: inherit;
}

</style>
</head>

const MERCHANT_GU = ['jiuchong', 'heishi'];
function placeShopEntries(gs) {
  const shop = PLACES[gs.location]?.shop ?? [];
  if (gs.location !== 'gupu') return shop;
  const entries = [...shop];
  if (gs.flags.kaike) entries.push('gu:yueguang', 'gu:xiaoguang', 'gu:henshi');
  if (gs.minutes >= makeTime(2, 3, 1) && gs.minutes < makeTime(2, 3, 9)) {
    for (const id of MERCHANT_GU) {
      if (!gs.flags[`merchant_${id}_bought`]) entries.push(`gu:${id}`);
    }
  }
  return entries;
}

    隐匿: `护盾 ${Math.round(def.power * 0.6)} · 持续至耗尽或战斗结束`

    xuefu_gu: ' · 回复实际伤害的 35%'
  }[def.id] || '';

}

function recipeIngredientsText(recipe) {

    .map(([id, count]) => `${(GU_DEFS[id] || ITEMS[id]).name}${count > 1 ? ` ×${count}` : ''}`)

}

  return b;
}

function evalToken(gs, token) {

  if (token === 'benming') return !!gs.player.benming;
  if (token.startsWith('flag:')) return !!gs.flags[token.slice(5)];
  if (token.startsWith('at:')) return gs.location === token.slice(3);
  if (token.startsWith('before:')) return gs.minutes < parseTimeExpr(token.slice(7));
  if (token.startsWith('after:')) return gs.minutes >= parseTimeExpr(token.slice(6));

function evalCond(gs, cond) {

    const t = raw.trim();
    if (!t) return true;
    const neg = t.startsWith('!');
    const ok = evalToken(gs, neg ? t.slice(1) : t);

}

function placeMoveList(gs) {
  if (!PLACES[gs.location]) return [];
  const routes = new Map([[gs.location, { minutes: 0, blocked: '' }]]);
  const pending = new Set([gs.location]);

  while (pending.size) {
    const id = [...pending].reduce((nearest, candidate) => (
      routes.get(candidate).minutes < routes.get(nearest).minutes ? candidate : nearest
    ));
    pending.delete(id);
    const route = routes.get(id);
    if (route.blocked) continue;

    for (const [next, duration] of Object.entries(PLACES[id].links)) {
      const target = PLACES[next];
      if (!target || (target.hidden && !gs.flags[target.hidden])) continue;
      const minutes = route.minutes + duration;
      if (minutes >= (routes.get(next)?.minutes ?? Infinity)) continue;
      const blocked = target.lock && !gs.flags[target.lock.flag] ? target.lock.msg : '';
      routes.set(next, { minutes, blocked });
      pending.add(next);
    }
  }

  routes.delete(gs.location);
  return [...routes].map(([id, route]) => ({ id, name: PLACES[id].name, ...route }));
}
function moveToPlace(gs, targetId) {

    sess.heat += 14 + Math.round(rng() * 14);
    sess.rateBonus += 0.12;
    sess.lines.push(`第 ${sess.round} 轮猛火催炼，炉温飙至 ${Math.round(sess.heat)}°（成算 +12%）。`);
  } else if (mode === 'cool') {
    sess.heat = Math.max(15, sess.heat - (14 + Math.round(rng() * 10)));
    sess.rateBonus += 0.04;
    sess.lines.push(`第 ${sess.round} 轮收火降温，炉温回落至 ${Math.round(sess.heat)}°（成算 +4%）。`);
  }

  if (sess.heat > 96 || sess.heat < 15) {
    sess.state = 'done';
    sess.success = false;
    const auxUid = sess.guUids[1];
    const damage = auxUid === undefined ? '保住了主蛊。' : '损毁了一只辅蛊，保住了主蛊。';
    if (auxUid !== undefined) removeGuByUid(gs, auxUid);
    sess.lines.push(`炉温失控炸炉！${damage}`);
    addLog(gs, `【炼蛊炸炉】「${sess.outName}」${sess.method}失控。${damage}`, 'log-bad');
    return sess;
  }

  if (sess.round >= sess.maxRounds) {
    sess.state = 'done';
    const sweetBonus = (sess.heat >= 45 && sess.heat <= 75) ? 0.10 : 0;
    const finalRate = Math.min(0.95, sess.baseRate + sess.rateBonus + sweetBonus);
    const usesBenming = sess.guUids.includes(gs.player.benming);
    for (const uid of sess.guUids) removeGuByUid(gs, uid);

    if (rng() < finalRate) {
      sess.success = true;
      const result = addGu(gs, sess.outId, 100);
      if (usesBenming) gs.player.benming = result.uid;
      for (let count = 1; count < sess.outCount; count++) addGu(gs, sess.outId, 100);
      sess.lines.push(`成算 ${Math.round(finalRate * 100)}% —— 炉盖掀开，得「${sess.outName}」！`);
      addLog(gs, `【炼蛊大成】成功${sess.method}出「${sess.outName}」！`, 'log-gold');
    } else {
      sess.success = false;
      sess.lines.push(`成算 ${Math.round(finalRate * 100)}% —— 炉中青烟散尽，${sess.method}功亏一篑。`);
      addLog(gs, `【炼蛊失败】「${sess.outName}」${sess.method}未成。`, 'log-bad');
    }
    return sess;
  }

  sess.round++;
  return sess;
}


/* === src/core/breakthrough.js === */
function realmGuRequirement(p) {
  const rank = p.xiao < 3 ? p.rank : p.rank + 1;
  const need = p.xiao < 3 ? p.xiao + 2 : 1;
  const count = p.gu.filter((g) => GU_DEFS[g.id]?.rank === rank).length;
  return { need, count, text: `持有 ${rank} 转蛊虫 ${count}/${need} 只` };
}
function realmGrowthText(before, after) {
  const stats = [['hpMax', '气血上限'], ['zyMax', '真元上限'], ['speed', '身法']];
  return stats.map(([key, label]) => `${label} ${before[key]} → ${after[key]}`).join(' · ');
}
function washMinorWall(gs) {
  const p = gs.player;
  if (p.xiao >= 3) return { ok: false, reason: '已至本转巅峰，须破壁冲击大境界' };
  const gu = realmGuRequirement(p);
  if (gu.count < gu.need) return { ok: false, reason: gu.text };
  const needXp = minorXpNeed(p);
  const needZy = Math.round(p.zyMax * 0.6);
  if (p.xp < needXp) return { ok: false, reason: `修为不足（需 ${needXp}）` };
  if (p.zy < needZy) return { ok: false, reason: `真元不足（需 ${needZy}）` };
  const before = { ...p };
  p.xp -= needXp;
  p.zy -= needZy;
  p.xiao++;
  recalcStats(gs);
  const message = `晋入${realmText(p)} · ${realmGrowthText(before, p)}`;
  addLog(gs, `【冲刷窍壁】${message}`, 'log-gold');
  return { ok: true, message };
}
function createBreakSession(gs) {
  const p = gs.player;
  if (p.rank >= 4) return { error: '青茅山卷暂止于三/四转' };
  if (p.xiao < 3) return { error: '须先修至本转巅峰，方可破壁' };
  const gu = realmGuRequirement(p);
  if (gu.count < gu.need) return { error: gu.text };
  if (p.zy < Math.round(p.zyMax * 0.9)) return { error: '真元须温养至九成以上' };
  const crackMult = Math.min(2.2, 1 + 0.2 * (p.attempts || 0));
  return {
    crack: 0,
    hurt: 0,
    zy: p.zy,
    zyMax: p.zyMax,
    stones: p.yuanshi,
    stonesUsed: 0,
    turn: p.rank,
    wallHeal: p.hai < 4.5 ? 5 : 3,
    crackMult,
    steps: 0,
    state: 'ongoing',
    lines: [
      '你盘膝坐定，心神沉入空窍。窍壁薄如晶膜，却坚韧异常。',
      p.attempts ? `此前冲关 ${p.attempts} 次未成，此番心得令破壁裂痕多 ${Math.round((crackMult - 1) * 100)}%。` : '每次冲关后窍壁都会略微愈合，注意真元与震伤。'
    ]
  };
}
function stepBreakSession(gs, sess, key, rng = Math.random) {
  if (!sess || sess.state !== 'ongoing') return sess;
  sess.steps++;
  const zyMax = sess.zyMax;
  const hardNeed = Math.max(1, Math.round(zyMax * 0.55));
  const softNeed = Math.max(1, Math.round(zyMax * 0.28));
  const steadyNeed = Math.max(1, Math.round(zyMax * 0.15));
  const stoneCost = sess.turn * 10;
  let msg = '';

  if (key === 'hard' || key === 'soft') {
    const need = key === 'hard' ? hardNeed : softNeed;
    const spend = Math.min(sess.zy, need);
    if (spend <= 0) return sess;
    const base = key === 'hard' ? 40 : 22;
    const gain = base * (spend / need) * sess.crackMult * (0.9 + rng() * 0.2);
    const hurtGain = key === 'hard' ? (7 + Math.floor(rng() * 5)) : (2 + Math.floor(rng() * 2));
    sess.zy = Math.max(0, sess.zy - spend);
    sess.crack = Math.min(100, sess.crack + gain);
    sess.hurt = Math.min(100, sess.hurt + hurtGain);
    msg = `${key === 'hard' ? '强行撞击' : '稳步冲击'}窍壁（真元 -${Math.round(spend)}），裂痕 +${gain.toFixed(1)}%，震伤 +${hurtGain}。`;
  } else if (key === 'stone') {
    if (sess.stones < stoneCost || sess.zy >= zyMax) return sess;
    const zyGain = Math.min(zyMax - sess.zy, Math.max(8, Math.round(zyMax * 0.42)));
    sess.stones -= stoneCost;
    sess.stonesUsed += stoneCost;
    sess.zy += zyGain;
    msg = `消耗 ${stoneCost} 块元石，空窍真元恢复 +${Math.round(zyGain)}。`;
  } else if (key === 'steady') {
    if (sess.zy < steadyNeed || sess.hurt <= 0) return sess;
    const heal = Math.min(sess.hurt, 16);
    sess.zy -= steadyNeed;
    sess.hurt -= heal;
    msg = `催动真元温养空窍（真元 -${steadyNeed}），震伤 -${heal}。`;
  } else if (key === 'stop') {
    sess.state = 'stopped';
    gs.player.attempts = (gs.player.attempts || 0) + 1;
    gs.player.yuanshi = Math.max(0, gs.player.yuanshi - sess.stonesUsed);
    gs.player.zy = Math.round(sess.zy);
    sess.lines.push('你主动散去真元退关，此番心得已留存。');
    addLog(gs, '【退关】破壁暂止，已积攒冲关心得。', 'log-warn');
    return sess;
  }

  if (sess.crack >= 100) {
    sess.crack = 100;
    sess.state = 'win';
    gs.player.yuanshi = Math.max(0, gs.player.yuanshi - sess.stonesUsed);
    const before = { ...gs.player };
    gs.player.rank++;
    gs.player.xiao = 0;
    gs.player.xp = 0;
    gs.player.attempts = 0;
    recalcStats(gs);
    gs.player.zy = Math.round(gs.player.zyMax * 0.5);
    if (gs.player.rank >= 2) gs.flags['open:jiazhuge'] = true;
    sess.lines.push(msg, `轰然一声脆响，窍壁彻底碎裂，你晋入${realmText(gs.player)}！`);
    const growth = realmGrowthText(before, gs.player);
    sess.lines.push(growth);
    addLog(gs, `【破境】晋入${realmText(gs.player)} · ${growth}`, 'log-gold');
    return sess;
  }

  if (sess.hurt >= 100) {
    sess.hurt = 100;
    sess.state = 'lose';
    gs.player.attempts = (gs.player.attempts || 0) + 1;
    gs.player.yuanshi = Math.max(0, gs.player.yuanshi - sess.stonesUsed);
    gs.player.hp = Math.max(5, Math.round(gs.player.hp * 0.5));
    gs.player.zy = 0;
    sess.lines.push(msg, '空窍震伤过重，真元反噬，被迫中止冲关！');
    addLog(gs, '【冲关受挫】震伤过重，退回养伤（已攒下冲关心得）。', 'log-bad');
    return sess;
  }

  const healed = Math.min(sess.crack, sess.wallHeal);
  sess.crack = Math.max(0, sess.crack - healed);
  sess.zy = Math.min(zyMax, sess.zy + Math.max(2, Math.round(zyMax * 0.06)));
  sess.lines.push(`${msg} 窍壁自愈 ${healed.toFixed(1)}%。`);
  if (sess.lines.length > 6) sess.lines = sess.lines.slice(-6);
  return sess;
}

/* === src/ui/map-view.js === */
function renderMapPanel(gs, title = '青茅山舆图 · 可去之处') {
  const moves = placeMoveList(gs);
  const moveMap = Object.fromEntries(moves.map((m) => [m.id, m]));
  const visibleIds = Object.keys(PLACES).filter((id) => !PLACES[id].hidden || gs.flags[PLACES[id].hidden]);
  const drawn = {};
  let edges = '', nodes = '';

  for (const pid of visibleIds) {
    const place = PLACES[pid];
    for (const tid of Object.keys(place.links || {})) {
      if (!PLACES[tid] || (PLACES[tid].hidden && !gs.flags[PLACES[tid].hidden])) continue;
      const key = pid < tid ? `${pid}|${tid}` : `${tid}|${pid}`;
      if (drawn[key]) continue;
      drawn[key] = true;
      const target = PLACES[tid];
      const active = pid === gs.location || tid === gs.location;
      const other = pid === gs.location ? tid : pid;
      const cls = active ? (moveMap[other]?.blocked ? 'map-edge is-blocked' : 'map-edge is-active') : 'map-edge';
      edges += `<line class="${cls}" x1="${place.x}" y1="${place.y}" x2="${target.x}" y2="${target.y}"/>`;
    }

    const mv = moveMap[pid];
    const style = `left:${place.x}%;top:${place.y}%`;
    if (pid === gs.location) {
      const label = `<b>${esc(place.name)}</b><small>在此</small>`;
      nodes += hasPlaceActions(gs)
        ? `<button type="button" class="map-node is-here" style="${style}" data-action="openPlace" aria-haspopup="dialog">${label}</button>`
        : `<div class="map-node is-here" style="${style}">${label}</div>`;
    } else if (mv) {
      nodes += `<button type="button" class="map-node is-move" style="${style}" data-action="walkTo" data-id="${pid}" ${mv.blocked ? 'disabled title="' + esc(mv.blocked) + '"' : ''}>
        <b>${esc(place.name)}</b><small>${esc(mv.blocked ? '受阻' : formatDuration(mv.minutes))}</small>
      </button>`;
    } else {
      nodes += `<div class="map-node is-far" style="${style}"><b>${esc(place.name)}</b></div>`;
    }
  }

  const blockedHints = moves.filter((m) => m.blocked).map((m) => `<div>· ${esc(m.name)}：${esc(m.blocked)}</div>`).join('');

  return `<div class="card">
    <div class="kv"><h3>${esc(title)}</h3><span class="muted">点击金框行脚，点击当前位置查看详情</span></div>
    <div class="map-scroll">
      <div class="map-canvas ${isNight(gs.minutes) ? 'is-night' : ''}">
        <svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${edges}</svg>
        ${nodes}
      </div>
    </div>
    ${blockedHints ? `<div class="muted" style="margin-top:8px;font-size:.82rem">${blockedHints}</div>` : ''}
  </div>`;
}

function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

function renderModal() {
  const modalEl = document.getElementById('modal');
  const sheetEl = document.getElementById('sheet');
  if (!modalEl || !sheetEl) return;

  if (MODAL?.kind === 'place' && (G.battle || G.player.dead)) MODAL = null;
  const placeShown = MODAL?.kind === 'place' && !G.pendingEventId;
  const samePlaceSheet = sheetEl.classList.contains('place-sheet');
  const scrollTop = placeShown && samePlaceSheet ? sheetEl.scrollTop : 0;
  sheetEl.classList.toggle('place-sheet', placeShown);
  if (placeShown) sheetEl.setAttribute('aria-labelledby', 'place-title');
  else sheetEl.removeAttribute('aria-labelledby');

  if (G && G.pendingEventId && !G.battle && (!MODAL || MODAL.kind === 'place')) {
    sheetEl.innerHTML = renderEventModal(G.pendingEventId);
    modalEl.hidden = false;
    return;
  }
  if (!MODAL) {
    modalEl.hidden = true;
    sheetEl.innerHTML = '';
    return;
  }
  let html = '';
  if (MODAL.kind === 'place') {
    html = `<div class="place-sheet-controls"><button class="sm" data-action="closeModal">返回地图</button></div>${renderPlaceView(G)}`;
  } else if (MODAL.kind === 'break') html = renderBreakModal(MODAL.data);
  else if (MODAL.kind === 'refine') html = renderRefineModal(MODAL.data);
  else if (MODAL.kind === 'killer') html = renderCustomKillerModal(G, KM_DRAFT);
  else if (MODAL.kind === 'dead') {
    html = `<h2>身殒青茅山</h2>
      <p>你的修行止步于${esc(realmText(G.player))}。</p>
      <div class="row">
        ${G.snapshot ? '<button class="gold" data-action="rewindCicada">催动春秋蝉回到旧影</button>' : ''}
        <button class="blood" data-action="resetGame">重开一世</button>
      </div>`;
  } else if (MODAL.kind === 'win') {
    html = `<h2>走出青茅山 · 卷一圆满</h2>
      <p>血海翻涌、仙鹤坠落，你在两位三转强者的死斗边缘活了下来，终于踏出十万大山，走向五域天地！</p>
      <div class="card">
        <div class="kv"><span>最终境界</span><b>${esc(realmText(G.player))}</b></div>
        <div class="kv"><span>持有蛊虫</span><b>${G.player.gu.length} 只</b></div>
        <div class="kv"><span>剩余元石</span><b>${G.player.yuanshi}</b></div>
      </div>
      <div class="row">
        <button class="primary" data-action="closeModal">继续游历青茅余烬</button>
        <button class="gold" data-action="resetGame">再开新的一世</button>
      </div>`;
  }
  sheetEl.innerHTML = html;
  modalEl.hidden = false;
  sheetEl.scrollTop = scrollTop;
  if (placeShown && !samePlaceSheet) sheetEl.querySelector('[data-action="closeModal"]').focus();
}
function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (!G) {
    START.hasSave = !!loadGame();
    app.innerHTML = renderStartScreen(START);
    renderModal();
    return;
  }

  let body = '';
  if (G.battle) {
    body = renderBattleView(G);
  } else if (TAB === 'place') {
    body = renderMapPanel(G);
  } else if (TAB === 'aperture') {
    body = renderApertureView(G);
  } else if (TAB === 'refine') {
    body = renderRefineView(G);
  } else {
    body = renderBagView(G, TAB);
  }

  const navButtons = [
    ['place', '地图'], ['aperture', '空窍'],
    ['refine', '炼蛊'], ['bag', '行囊'], ['journal', '行纪']
  ].map(([id, label]) => `<button class="${TAB === id ? 'on' : ''}" data-action="navTab" data-tab="${id}">${label}</button>`).join('');

  app.innerHTML = `<div class="shell">
    ${renderTopBar()}
    <main class="main">${body}</main>
    <nav class="nav">${navButtons}</nav>
  </div>`;
  renderModal();
}

function handlePlaceAction(id) {
  const p = G.player;
  if (id === 'meditate') { advanceMinutes(G, 120); addLog(G, '你盘膝打坐一个时辰，吐纳天地灵气。'); }
  else if (id === 'rest') { advanceMinutes(G, 480); addLog(G, '你在竹楼安歇四个时辰，精神恢复了不少。'); }
  else if (id === 'pickBenming') {
    claimBenming(G);
  } else if (id === 'caoren') {
    advanceMinutes(G, 30);
    G.flags['practiced'] = true;
    startBattle(G, 'caoren', '演武场练手');
  } else if (id === 'sparring') {
    advanceMinutes(G, 60);
    startBattle(G, 'fangzheng', '同窗切磋');
  } else if (id === 'docHeal') {
    if (p.yuanshi < 10) { showToast('元石不足 10 块'); return; }
    p.yuanshi -= 10;
    p.hp = p.hpMax;
    addLog(G, '你在药堂敷药调理，气血已然回满。', 'log-good');
  } else if (id === 'rumor') {
    if (p.yuanshi < 12) { showToast('元石不足 12 块'); return; }
    p.yuanshi -= 12;
    advanceMinutes(G, 30);
    if (!G.flags['clue:huajiu']) {
      G.flags['clue:huajiu'] = true;
      addLog(G, '【密闻】酒客低声提起：血蝠洞下游瀑布后，藏着花酒行者的暗涧遗洞。', 'log-gold');
    } else {
      addLog(G, '【传闻】听说山外狼群正在集结，明年夏天怕是要闹狼潮。');
    }
  } else if (id === 'clanGift') {
    if (!G.flags['clan_gift_r2']) {
      G.flags['clan_gift_r2'] = true;
      p.yuanshi += 40;
      addGu(G, 'qingtong_sheli');
      addGu(G, 'yupi');
      addLog(G, '【家族赏赐】族长嘉许你晋入二转，赏元石 40、青铜舍利蛊和玉皮蛊各 1 只！', 'log-gold');
    } else {
      showToast('族中近来暂无新赏格');
      return;
    }
  } else if (id === 'exploreFight') {
    const place = PLACES[G.location];
    advanceMinutes(G, 60);
    if (!G.battle && place.exploreEnemy) startBattle(G, place.exploreEnemy, `${place.name}遭遇`);
  } else if (id === 'exploreBoss') {
    const place = PLACES[G.location];
    advanceMinutes(G, 60);
    if (!G.battle && place.bossEnemy) startBattle(G, place.bossEnemy, `讨伐${place.name}`);
  } else if (id === 'gather') {
    advanceMinutes(G, 120);
    const pool = ['yuelanhua', 'shourou', 'fengmi', 'kuangshi', 'yuanshi_zha'];
    const got = pool[Math.floor(Math.random() * pool.length)];
    addItem(G, got, 2);
    recordQuestProgress(G, 'gather', G.location);
    addLog(G, `你在山间采集了 2 份「${ITEMS[got].name}」。`, 'log-good');
  } else if (id === 'huajiuLoot') {
    if (G.flags['looted:huajiu']) { showToast('遗洞宝藏已被你取空'); return; }
    G.flags['looted:huajiu'] = true;
    advanceMinutes(G, 60);
    p.yuanshi += 45;
    addGu(G, 'jiuchong', 100);
    addGu(G, 'baishi');
    addGu(G, 'yupi');
    addGu(G, 'chunqiuchan', 100);
    addItem(G, 'qingzhujiu', 5);
    addLog(G, '【遗洞奇遇】你从花酒遗藏中取得酒虫、白豕蛊、玉皮蛊与 45 元石。', 'log-gold');
    addLog(G, '【遗洞奇遇】你还发现一只气息微弱的「春秋蝉（残）」。', 'log-gold');
  } else if (id === 'escapeMountain') {
    p.escapedMountain = true;
    openModal('win', {});
  }
  saveGame(G);
  render();
}

function handleAction(el) {
  const act = el.dataset.action;
  if (!act) return;
  const id = el.dataset.id || '';

  if (act === 'startKaiqiao') {
    const input = document.getElementById('startName');
    START.name = (input?.value || '').trim() || '方源';
    START.apt = createAptitude();
    START.step = 0;
    START.target = Math.max(10, Math.min(48, Math.round(START.apt.hai * 5)));
    START.done = false;
    START.phase = 'kaiqiao';
    render();
  } else if (act === 'kaiqiaoStep') {
    START.step = Math.min(START.target, START.step + 5);
    if (START.step >= START.target) START.done = true;
    render();
  } else if (act === 'kaiqiaoSkip') {
    START.step = START.target;
    START.done = true;
    render();
  } else if (act === 'kaiqiaoFinish') {
    G = createNewGame(START.name, START.apt);
    START.phase = 'intro';
    TAB = 'place';
    saveGame(G);
    render();
  } else if (act === 'continueSave') {
    G = loadGame();
    if (!G) { showToast('未找到可用存档'); return; }
    TAB = 'place';
    render();
  } else if (act === 'navTab') {
    if (MODAL?.kind === 'place') MODAL = null;
    TAB = el.dataset.tab || 'place';
    render();
  } else if (act === 'togglePause') {
    G.paused = !G.paused;
    render();
  } else if (act === 'walkTo') {
    const res = moveToPlace(G, id);
    if (!res.ok) showToast(res.reason);
    else if (G.location === id) {
      MODAL = hasPlaceActions(G) ? { kind: 'place' } : null;
      const sheet = document.getElementById('sheet');
      if (sheet) sheet.scrollTop = 0;
    }
    saveGame(G);
    render();
  } else if (act === 'openPlace') {
    if (G && !G.battle && !G.player.dead && hasPlaceActions(G)) openModal('place');
  } else if (act === 'placeAct') {
    handlePlaceAction(id);
  } else if (act === 'quest') {
    handleQuest(G, id);
    saveGame(G);
    render();
  } else if (act === 'buyRecipe') {
    const recipe = REFINE_RECIPES.find((r) => r.id === id);
    const p = G.player;
    if (!PLACES[G.location]?.services.includes('recipes') || !recipe || p.recipes?.includes(id) || p.yuanshi < recipe.price) return;
    p.yuanshi -= recipe.price;
    (p.recipes ??= []).push(id);
    const message = `已习得「${recipeOutputText(recipe)}」${recipe.method ?? ''}蛊方，花费 ${recipe.price} 元石`;
    addLog(G, `【蛊方】${message}。`, 'log-gold');
    saveGame(G);
    render();
    showToast(message);
  } else if (act === 'buyItem') {
    if (!placeShopEntries(G).includes(id)) return;
    const [kind, itemId] = id.split(':');
    const def = kind === 'gu' ? GU_DEFS[itemId] : ITEMS[itemId];
    if (!def || G.player.yuanshi < def.price) { showToast('元石不足'); return; }
    G.player.yuanshi -= def.price;
    if (kind === 'gu') addGu(G, itemId, 100);
    else addItem(G, itemId, 1);
    if (MERCHANT_GU.includes(itemId)) G.flags[`merchant_${itemId}_bought`] = true;
    const message = `已购入「${def.name}」，花费 ${def.price} 元石`;
    addLog(G, `${message}。`);
    saveGame(G);
    render();
    showToast(message);
  } else if (act === 'checkEvents') {
    checkStoryTriggers(G, id);
    render();
  } else if (act === 'refineBenming') {
    const res = refineBenming(G);
    if (!res.ok) { showToast(res.reason); return; }
    saveGame(G);
    render();
  } else if (act === 'chooseEvent') {
    applyEventChoice(G, id, Number(el.dataset.idx) || 0);
    saveGame(G);
    render();
  } else if (act === 'washMinor') {
    const res = washMinorWall(G);
    showToast(res.ok ? res.message : res.reason);
    saveGame(G);
    render();
  } else if (act === 'openBreak') {
    const sess = createBreakSession(G);
    if (sess.error) { showToast(sess.error); return; }
    openModal('break', sess);
  } else if (act === 'breakAct' && MODAL?.kind === 'break') {
    stepBreakSession(G, MODAL.data, id);
    saveGame(G);
    render();
  } else if (act === 'startRefine') {
    const sess = createRefineSession(G, id);
    if (sess.error) { showToast(sess.error); return; }
    openModal('refine', sess);
  } else if (act === 'refineAct' && MODAL?.kind === 'refine') {
    stepRefineSession(G, MODAL.data, id);
    saveGame(G);
    render();
  } else if (act === 'openCustomKiller') {
    KM_DRAFT = { coreId: '', auxIds: [], name: '' };
    openModal('killer', {});
  } else if (act === 'kmPickCore') {
    KM_DRAFT.coreId = id;
    KM_DRAFT.auxIds = KM_DRAFT.auxIds.filter((x) => x !== id);
    render();
  } else if (act === 'kmToggleAux') {
    const i = KM_DRAFT.auxIds.indexOf(id);
    if (i >= 0) KM_DRAFT.auxIds.splice(i, 1);
    else if (KM_DRAFT.auxIds.length < 2) KM_DRAFT.auxIds.push(id);
    render();
  } else if (act === 'kmCreate') {
    const nm = document.getElementById('kmName')?.value || '';
    const res = createKillerMove(G, KM_DRAFT.coreId, KM_DRAFT.auxIds, nm);
    if (!res.ok) { showToast(res.reason); return; }
    closeModal();
    saveGame(G);
    render();
  } else if (act === 'toggleAutoFeed') {
    G.player.autoFeed = !G.player.autoFeed;
    if (G.player.autoFeed) {
      for (const gu of G.player.gu) feedGu(G, gu, 51);
    }
    saveGame(G);
    render();
  } else if (act === 'feedGu' || act === 'feedAll') {
    if (act === 'feedGu') {
      if (!feedGu(G, G.player.gu.find((g) => String(g.uid) === id))) return;
    } else {
      const fed = G.player.gu.filter((g) => feedGu(G, g, 85)).length;
      showToast(fed ? `已喂养 ${fed} 只蛊虫` : '无需喂养或口粮不足');
    }
    saveGame(G);
    render();
  } else if (act === 'toggleEquip') {
    const uid = Number(id);
    const i = G.player.equipped.indexOf(uid);
    if (i >= 0) G.player.equipped.splice(i, 1);
    else if (G.player.equipped.length < 6) G.player.equipped.push(uid);
    else showToast('至多同时出战 6 只蛊');
    saveGame(G);
    render();
  } else if (act === 'useWhiteBoarGu') {
    if (!useWhiteBoarGu(G, Number(id))) return;
    saveGame(G);
    render();
  } else if (act === 'useSheli') {
    const uid = Number(id);
    const g = G.player.gu.find((x) => x.uid === uid);
    if (!g) return;
    if (!['qingtong_sheli', 'chitie_sheli'].includes(g.id)) return;
    const targetRank = g.id === 'qingtong_sheli' ? 1 : 2;
    if (G.player.rank !== targetRank || G.player.xiao >= 3) {
      showToast('仅限对应转数未达巅峰时使用');
      return;
    }
    const gu = realmGuRequirement({ ...G.player, gu: G.player.gu.filter((x) => x.uid !== uid) });
    if (gu.count < gu.need) { showToast(gu.text); return; }
    const before = { ...G.player };
    G.player.gu = G.player.gu.filter((x) => x.uid !== uid);
    G.player.xiao++;
    recalcStats(G);
    const message = `晋入${realmText(G.player)} · ${realmGrowthText(before, G.player)}`;
    addLog(G, `【舍利破境】${message}`, 'log-gold');
    showToast(message);
    saveGame(G);
    render();
  } else if (act === 'useHealItem') {
    const result = useHealItem(G, id);
    if (!result.ok) {
      if (result.reason) showToast(result.reason);
      return;
    }
    saveGame(G);
    render();
  } else if (act === 'battleAct') {
    battleAct(G, el.dataset.kind, id);
    saveGame(G);
    render();
  } else if (act === 'finishBattle') {
    const dead = G.player.dead;
    G.battle = null;
    if (dead) openModal('dead', {});
    else checkStoryTriggers(G);
    saveGame(G);
    render();
  } else if (act === 'saveCicada') {
    const res = saveSpringSnapshot(G);
    showToast(res.ok ? '已留下春秋蝉旧影' : res.reason);
    saveGame(G);
    render();
  } else if (act === 'rewindCicada') {
    const res = rewindSpringCicada(G);
    if (!res.ok) { showToast(res.reason); return; }
    G = res.state;
    closeModal();
    saveGame(G);
    render();
  } else if (act === 'manualSave') {
    saveGame(G);
    showToast('进度已保存');
  } else if (act === 'exportSave') {
    const text = JSON.stringify(G, null, 2);
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => showToast('存档 JSON 已复制到剪贴板'));
    else showToast('请从控制台查看存档');
  } else if (act === 'resetGame') {
    if (typeof localStorage !== 'undefined') localStorage.removeItem('gujie_qingmaoshan_v1');
    G = null;
    MODAL = null;
    START = { phase: 'intro', name: '方源', apt: null, step: 0, target: 25, done: false, hasSave: false };
    render();
  } else if (act === 'closeModal') {
    closeModal();
  }
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (btn) handleAction(btn);
});

// 轻实时时间流：现实 1 秒 = 游戏 1 刻 (15 分钟)
setInterval(() => {
  if (!G || G.paused || G.player.dead || G.battle || G.pendingEventId || MODAL) return;
  advanceMinutes(G, 15);
  if (G.player.dead) openModal('dead', {});
  render();
}, 1000);

G = loadGame();
render();

</script>
</body>
