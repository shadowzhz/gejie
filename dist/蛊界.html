<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1917">
  <title>蛊界 · 青茅山篇</title>
  <style>
:root {
  --bg: #0c1715;
  --bg2: #122320;
  --card: #162b27;
  --card2: #1c3530;
  --line: #294942;
  --ink: #ebe7dc;
  --dim: #9ab0a8;
  --jade: #72c4a3;
  --gold: #d8bf87;
  --blood: #e07a6b;
  --warn: #e3a857;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.55;
  min-height: 100%;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card2);
  border-radius: 8px;
  padding: 8px 14px;
  min-height: 40px;
  transition: background .15s, border-color .15s, transform .1s;
}
button:hover:not(:disabled) { background: #23433d; border-color: var(--jade); }
button:disabled { opacity: .48; cursor: not-allowed; }
button.primary { background: #1e4d3f; border-color: var(--jade); color: #f4f9f6; font-weight: 600; }
button.gold { background: #3e341f; border-color: var(--gold); color: #f6e9c8; font-weight: 600; }
button.blood { background: #4a2320; border-color: var(--blood); color: #fde4e0; font-weight: 600; }
button.ghost { background: transparent; }
button.sm { min-height: 32px; padding: 4px 10px; font-size: .85rem; }

.shell {
  max-width: 960px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-bottom: 74px;
}

/* 顶部在场状态栏 */
.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(12, 23, 21, .95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 8px 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.top-id { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.top-id strong { font-size: 1.05rem; color: var(--gold); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: .78rem;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--dim);
}
.badge.jade { border-color: var(--jade); color: var(--jade); }
.badge.gold { border-color: var(--gold); color: var(--gold); }
.badge.blood { border-color: var(--blood); color: var(--blood); }

.clock-box { display: flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--dim); }
.goal-bar {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: .82rem;
  color: #dfd3b4;
  padding: 2px 0 2px 8px;
  border-left: 2px solid var(--gold);
}
.goal-bar > span { font-size: .74rem; color: var(--gold); flex-shrink: 0; }
.res-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: center; }
.res-item { min-width: 0; }
.res-head { display: flex; justify-content: space-between; gap: 10px; font-size: .76rem; color: var(--dim); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.res-meta .res-head { margin-bottom: 0; white-space: nowrap; }
.res-meta b { color: var(--gold); font-weight: 600; }
.bar { height: 6px; background: #0c1513; border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--jade); transition: width .2s; }
.bar.hp > i { background: #d46b5e; }
.bar.zy > i { background: #5da9c4; }

/* 主内容区 */
.main { flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.card h2, .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: var(--gold); }
.muted { color: var(--dim); font-size: .88rem; }
.kv { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }

/* 场景舞台 + 昼夜氛围 */
.stage {
  background: linear-gradient(155deg, #18322c, #10201d);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}
.stage.is-night {
  background: linear-gradient(155deg, #101b24, #0b1318);
  border-color: #263847;
}
.stage-loc { font-size: .84rem; color: var(--gold); margin-bottom: 4px; }
.stage h1 { margin: 0 0 8px; font-size: 1.65rem; font-family: Georgia, "Songti SC", serif; }
.stage-desc { margin: 0 0 14px; color: #ddd8ca; }

/* 山野舆图 */
.map-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #101d1a; }
.map-canvas {
  position: relative;
  min-width: 600px;
  height: 340px;
  background:
    radial-gradient(circle at 28% 45%, rgba(114, 196, 163, .10), transparent 50%),
    radial-gradient(circle at 80% 72%, rgba(216, 191, 135, .08), transparent 40%);
}
.map-canvas.is-night {
  background:
    radial-gradient(circle at 28% 45%, rgba(90, 140, 160, .10), transparent 50%),
    radial-gradient(circle at 80% 72%, rgba(150, 130, 90, .06), transparent 40%);
}
.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-edge { stroke: #31524a; stroke-width: .6; stroke-dasharray: 1.4 1.2; opacity: .65; }
.map-edge.is-active { stroke: var(--jade); stroke-width: .95; stroke-dasharray: none; opacity: .95; }
.map-edge.is-blocked { stroke: var(--warn); stroke-width: .75; stroke-dasharray: 1.2 1.2; opacity: .8; }
.map-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 70px;
  min-height: 0;
  padding: 5px 9px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg2);
  font-size: .8rem;
  line-height: 1.2;
  white-space: nowrap;
  z-index: 1;
}
.map-node small { font-size: .7rem; color: var(--dim); margin-top: 2px; }
.map-node.is-here { border-color: var(--jade); background: #1d4238; box-shadow: 0 0 0 2px rgba(114, 196, 163, .25); z-index: 2; }
.map-node.is-here small { color: var(--jade); font-weight: 600; }
.map-node.is-move { border-color: var(--gold); z-index: 2; }
.map-node.is-move:hover:not(:disabled) { background: #26483e; transform: translate(-50%, -53%); }
.map-node.is-far { opacity: .52; }

/* 空窍画布 */
.aperture-canvas {
  position: relative;
  height: 150px;
  border-radius: 10px;
  border: 1px solid #2b5452;
  background: radial-gradient(circle at 50% 65%, rgba(93, 169, 196, .28), rgba(16, 40, 44, .95) 70%);
  overflow: hidden;
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.aperture-gu-list { display: flex; flex-wrap: wrap; gap: 6px; z-index: 1; }
.gu-chip {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .82rem;
  background: rgba(12, 23, 21, .8);
  border: 1px solid var(--jade);
}
.gu-chip.weak { border-color: var(--blood); color: var(--blood); }

/* 蛊囊列表 */
.gu-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.gu-head h3 { margin: 0; }
.gu-list { list-style: none; margin: 0; padding: 0; }
.gu-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  padding: 12px 0 12px 12px;
  border-top: 1px solid rgba(41, 73, 66, .6);
  border-left: 2px solid transparent;
}
.gu-row:first-child { border-top: 0; }
.gu-row.is-equipped { border-left-color: var(--jade); }
.gu-main { min-width: 0; }
.gu-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.gu-title b { font-size: 1rem; }
.gu-meta { font-size: .8rem; color: var(--dim); }
.gu-tag { font-size: .75rem; color: var(--gold); }
.gu-tag.is-weak { color: var(--blood); }
.gu-tag::before { content: "· "; color: var(--dim); }
.gu-desc { margin: 2px 0 4px; font-size: .86rem; color: var(--dim); }
.gu-stats { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: .82rem; color: #cfd9d3; cursor: help; }
.gu-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; min-width: 128px; }
.gu-hunger { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.gu-hunger .bar { width: 64px; height: 4px; }
.gu-hunger.is-low { color: var(--blood); }
.gu-hunger.is-low .bar > i { background: var(--blood); }
.gu-food { font-size: .76rem; color: var(--dim); }
.gu-food.is-empty { color: var(--warn); }
.gu-actions { display: flex; gap: 6px; margin-top: 2px; }
.gu-actions button.sm { min-height: 28px; padding: 2px 10px; }
.gu-note { font-size: .78rem; color: var(--dim); }
@media (max-width: 520px) {
  .gu-row { grid-template-columns: 1fr; gap: 6px; }
  .gu-side { flex-direction: row; flex-wrap: wrap; align-items: center; min-width: 0; }
  .gu-actions { margin: 0 0 0 auto; }
}

/* 底部导航 */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: rgba(12, 23, 21, .97);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 6px 8px;
}
.nav button {
  min-height: 46px;
  padding: 4px 2px;
  font-size: .82rem;
  border-radius: 8px;
  background: transparent;
  border-color: transparent;
}
.nav button.on { background: var(--card2); border-color: var(--jade); color: var(--jade); font-weight: 600; }

/* 弹窗 & Toast */
.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(5, 10, 9, .78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.modal[hidden] { display: none; }
.sheet {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.place-sheet {
  width: min(860px, 100%);
}
.refine-sheet { width: min(640px, 100%); }
.refine-ritual { display: grid; gap: 12px; }
.refine-stage {
  --ember: #e69b51;
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: radial-gradient(ellipse at 50% 70%, #253b31, #0b1514 72%);
  text-align: center;
}
.refine-scene { position: relative; width: 200px; height: 178px; margin: auto; scale: 1.22; transform-origin: 50% 100%; }
.refine-halo, .refine-vapor, .refine-flame, .refine-pot, .refine-lid, .refine-result, .refine-shape {
  position: absolute;
  left: 50%;
  translate: -50% 0;
}
.refine-halo {
  bottom: 7px;
  width: 174px;
  height: 38px;
  border: 1px solid #5d8074;
  border-radius: 50%;
  box-shadow: 0 0 20px #7fb69d44, inset 0 0 16px #7fb69d44;
}
.refine-pot {
  bottom: 35px;
  width: 96px;
  height: 50px;
  border: 1px solid #a89566;
  border-radius: 10px 10px 42px 42px;
  background: linear-gradient(100deg, #26352c, #5d6045 48%, #252c23);
  box-shadow: -26px -13px 0 -21px #b6a275, 26px -13px 0 -21px #b6a275;
}
.refine-mouth {
  height: 16px;
  margin: -7px -6px 0;
  border: 2px solid #aa956c;
  border-radius: 50%;
  background: #121d18;
}
.refine-sigil {
  width: 13px;
  height: 13px;
  margin: 10px auto;
  border: 1px solid #d9bf79;
  rotate: 45deg;
}
.refine-flame {
  bottom: 13px;
  width: 85px;
  height: calc(30px + var(--heat) * 28px);
  opacity: 0;
  border-radius: 50%;
  background: radial-gradient(ellipse, #fff0ae, var(--ember) 38%, transparent 72%);
}
.refine-vapor {
  bottom: 85px;
  width: 70px;
  height: 35px;
  border-radius: 50%;
  background: radial-gradient(ellipse, var(--ember), transparent 72%);
  opacity: 0;
}
.refine-lid {
  bottom: 77px;
  width: 104px;
  height: 16px;
  border: 1px solid #bdab78;
  border-radius: 50%;
  background: linear-gradient(#b6a474, #373c30);
  opacity: 0;
}
.refine-lid::before {
  content: "";
  display: block;
  width: 18px;
  height: 8px;
  margin: -5px auto 0;
  border-radius: 8px 8px 0 0;
  background: #b6a474;
}
.refine-result {
  bottom: 95px;
  width: 16px;
  height: 16px;
  border: 1px solid #fff4c4;
  border-radius: 50% 25%;
  background: #e5ba63;
  box-shadow: 0 0 15px 5px #ffd67a88;
  rotate: 45deg;
  opacity: 0;
}
.refine-status { padding: 4px 12px 10px; color: var(--gold); font-weight: 600; }
.refine-feedback { padding: 0 12px 12px; color: var(--ink); font-size: .9rem; }
.refine-shape {
  bottom: 91px;
  width: 28px;
  height: 28px;
  border: 2px solid #d7f4d4;
  border-radius: 45% 20%;
  background: #c3f4bb55;
  box-shadow: 0 0 20px #acf2a7aa;
  opacity: 0;
  rotate: 45deg;
  scale: calc(.45 + .55 * var(--shape));
}
.refine-stage[data-state="ongoing"] .refine-shape { opacity: var(--shape); }
.refine-stage[data-state="ongoing"][data-hot="true"] { --ember: #ff7459; }
.refine-stage[data-state="ongoing"][data-hot="true"] .refine-pot { animation: furnace-shake .65s infinite; }
.refine-stage[data-state="ongoing"] .refine-flame {
  opacity: .85;
  animation: furnace-breathe 1.3s infinite alternate ease-in-out;
}
.refine-stage[data-effect="ignite"] .refine-flame,
.refine-stage[data-effect="pulse"] .refine-flame,
.refine-stage[data-effect="force"] .refine-flame {
  animation: furnace-flare .5s ease-out, furnace-breathe 1.3s .5s infinite alternate ease-in-out;
}
.refine-stage[data-effect="vent"] { --ember: #9ccbd7; }
.refine-stage[data-effect="gentle"] { --ember: #e5c980; }
.refine-stage[data-effect="signature"],
.refine-stage[data-effect="protect"] { --ember: #8de9cb; }
.refine-stage[data-state="success"] { --ember: #ffe192; }
.refine-stage[data-state="failure"] { --ember: #ef7763; }
.refine-stage[data-state="success"] .refine-vapor { opacity: .85; }
.refine-stage[data-state="failure"] .refine-vapor { opacity: .35; }
.refine-stage[data-state="failure"] .refine-status { color: var(--blood); }
.refine-stage[data-effect]:not([data-effect=""]) .refine-vapor { animation: furnace-release .65s ease-out; }
.refine-stage[data-effect="vent"] .refine-vapor { animation: furnace-vent .75s ease-out; }
.refine-stage[data-effect="gentle"] .refine-halo { animation: furnace-ring .9s ease-out; }
.refine-stage[data-effect="signature"] .refine-halo,
.refine-stage[data-effect="protect"] .refine-sigil { animation: furnace-ring .75s ease-out 2; }
.refine-stage[data-effect="seal"] .refine-lid {
  opacity: 1;
  animation: furnace-seal .55s ease-in both;
}
.refine-stage[data-effect="seal"] .refine-vapor { animation-delay: .55s; }
.refine-stage[data-state="success"] .refine-result { opacity: 1; }
.refine-stage[data-state="success"][data-effect="seal"] .refine-result { animation: furnace-reveal .65s .55s ease-out both; }
.refine-stage[data-state="failure"]:is([data-effect="force"], [data-effect="pulse"]) .refine-pot { animation: furnace-shake .4s ease-out; }
.refine-stage[data-state="failure"]:is([data-effect="force"], [data-effect="pulse"]) .refine-vapor { animation: furnace-burst .65s ease-out; }
.refine-stage[data-state="failure"][data-effect="seal"] .refine-lid {
  animation: furnace-seal .55s ease-in both, furnace-shake .4s .55s ease-out;
}
.refine-stage[data-effect="abort"] .refine-flame { animation: furnace-extinguish .65s ease-out; }
.refine-timing {
  position: relative;
  height: 14px;
  width: min(260px, 78%);
  margin: 14px auto 8px;
  border-radius: 7px;
  background: linear-gradient(90deg, #452b2a 25%, #285649 25% 40%, #b39252 40% 60%, #285649 60% 75%, #452b2a 75%);
}
.refine-timing > i {
  position: absolute;
  top: -3px;
  bottom: -3px;
  width: 4px;
  border-radius: 2px;
  translate: -50% 0;
  background: #fff4d4;
  box-shadow: 0 0 8px 3px #ffbe6d;
  animation: furnace-timing 1.5s infinite alternate linear;
}
.refine-drop {
  position: absolute;
  bottom: 112px;
  left: 50%;
  translate: -50% 0;
  padding: 2px 8px;
  border: 1px solid var(--gold);
  border-radius: 12px;
  background: var(--bg2);
  white-space: nowrap;
  animation: furnace-drop .5s ease-in both;
}
@keyframes furnace-timing { from { left: 0; } to { left: 100%; } }
@keyframes furnace-drop { 70% { opacity: 1; } to { transform: translateY(43px) scale(.35); opacity: 0; } }
@keyframes furnace-breathe { from { scale: .92 .85; } to { scale: 1.07 1.12; } }
@keyframes furnace-flare { 0% { scale: .65 .4; } 45% { scale: 1.35 1.55; } }
@keyframes furnace-release { from { opacity: .95; transform: translateY(10px) scale(.55); } to { transform: translateY(-16px) scale(1.5); } }
@keyframes furnace-vent {
  from { opacity: 1; transform: translateY(10px) scale(.5); }
  to { opacity: 0; transform: translate(35px, -23px) scale(2, .6); }
}
@keyframes furnace-burst {
  15% { opacity: 1; transform: translateY(10px) scale(1.6); }
  to { transform: translateY(-20px) scale(2.6); }
}
@keyframes furnace-ring { 45% { box-shadow: 0 0 24px 6px var(--ember), inset 0 0 12px var(--ember); scale: 1.06; } }
@keyframes furnace-seal { from { transform: translateY(-35px); opacity: 0; } 50% { opacity: 1; } }
@keyframes furnace-reveal { from { transform: translate(16px, 15px) scale(.3); opacity: 0; } }
@keyframes furnace-extinguish { from { opacity: .85; } to { opacity: 0; scale: .6 .15; } }
@keyframes furnace-shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) {
  .refine-scene * { animation: none !important; }
  .refine-drop { display: none; }
  .refine-timing > i { animation-timing-function: steps(10); }
}
.place-sheet-controls {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  justify-content: flex-end;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 76px;
  transform: translateX(-50%);
  z-index: 60;
  background: #203d36;
  border: 1px solid var(--jade);
  color: var(--ink);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: .88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
.toast.show { opacity: 1; }

.loglist { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; font-size: .86rem; }
.log-good { color: var(--jade); }
.log-bad { color: var(--blood); }
.log-warn { color: var(--warn); }
.log-gold { color: var(--gold); font-weight: 600; }
.intent-box {
  background: rgba(224, 122, 107, .1);
  border: 1px solid rgba(224, 122, 107, .35);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: .86rem;
}
/* 战斗 */
.battle-foe { display: flex; flex-direction: column; gap: 8px; }
.foe-top { display: flex; justify-content: space-between; align-items: baseline; }
.foe-name { display: flex; align-items: baseline; gap: 8px; }
.foe-name b { font-size: 1.25rem; font-family: Georgia, "Songti SC", serif; }
.foe-name span { font-size: .8rem; color: var(--dim); }
.battle-round { font-size: .82rem; color: var(--gold); }
.foe-status { display: flex; align-items: center; gap: 12px; font-size: .88rem; }
.foe-hp { display: flex; align-items: center; gap: 8px; flex: 1; font-variant-numeric: tabular-nums; color: var(--dim); }
.foe-hp .bar { flex: 1; max-width: 320px; }
.foe-zy { font-size: .8rem; color: #5da9c4; margin-left: 4px; }
.foe-hp.is-high { color: var(--ink); }
.foe-hp.is-mid { color: var(--warn); }
.foe-hp.is-low { color: var(--blood); }
.foe-shield { color: #9ccbd7; font-size: .82rem; }

function recipeOutputText(recipe) {
  const name = (GU_DEFS[recipe.out] || ITEMS[recipe.out]).name;
  return recipe.outCount > 1 ? `${name} ×${recipe.outCount}` : name;
}
function recipeIngredientsText(recipe) {
  return [...Object.entries(recipe.gu), ...Object.entries(recipe.materials)]
    .map(([id, count]) => `${(GU_DEFS[id] || ITEMS[id]).name}${count > 1 ? ` ×${count}` : ''}`)
    .join(' + ');
}

const MIN_PER_KE = 15;

const SHICHEN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const MONTHS = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];

function makeTime(year, month, day, shichen = 0) {
  return (((year - 1) * MONTHS_PER_YEAR + (month - 1)) * DAYS_PER_MONTH + (day - 1)) * MIN_PER_DAY + shichen * MIN_PER_SHICHEN;
}

function monthOf(m) { return Math.floor(m / MIN_PER_MONTH) % MONTHS_PER_YEAR + 1; }

function pickIntent(enemy, rng = Math.random) {
  const pool = enemy.moves.filter((m) => (enemy.cds[m.name] || 0) <= 0);
  const list = pool.length ? pool : [enemy.moves[0]];
  const total = list.reduce((s, m) => s + (m.weight || 1), 0);
  let r = rng() * total;
  for (const m of list) {
    r -= (m.weight || 1);
    if (r <= 0) return m;
  }
  return list[0];
}
function startBattle(gs, enemyId, tag = '遭遇战', rng = Math.random, { shield = 0, winFlag, winGu, storyEvent } = {}) {
  const tpl = ENEMIES[enemyId];
  if (!tpl || gs.battle) return null;
  const foe = {
    id: tpl.id,
    name: tpl.name,
    rank: tpl.rank,
    hp: tpl.hp,
    hpMax: tpl.hp,
    zy: tpl.zy,
    zyMax: tpl.zy,
    speed: tpl.speed,
    shield: 0,
    stunned: false,
    moves: tpl.moves,
    cds: {},
    intent: null,
    reward: tpl.reward || {},
    practice: !!tpl.practice
  };
  foe.intent = pickIntent(foe, rng);

  const b = {
    tag,
    round: 1,
    state: 'ongoing', // ongoing | win | lose | fled
    lethal: false,
    scouted: false,
    playerStunned: false,
    meShield: shield,
    winFlag,
    winGu,
    storyEvent,
    meBoost: 0,
    cds: {},
    guQueue: [],
    foe,
    logs: [`【${tag}】${foe.name}挡在前方。`]
  };

  if (foe.speed > gs.player.speed && !foe.practice) {
    b.logs.push(`${foe.name}身法更快，抢先出手！`);
    enemyTurn(gs, b, rng);
  }
  gs.battle = b;
  return b;
}

function enemyTurn(gs, b, rng = Math.random) {
  const foe = b.foe;
  if (foe.hp <= 0) return;
  const speed = b.haste?.turns > 0 ? b.haste.speed : 0;
  if (speed) b.haste.turns--;
  for (const k of Object.keys(foe.cds)) {
    if (foe.cds[k] > 0) foe.cds[k]--;
  }
  if (foe.stunned) {
    foe.stunned = false;
    b.logs.push(`${foe.name}身形一滞，错过了这一轮出手。`);
    foe.intent = pickIntent(foe, rng);
    return;
  }
  const mv = foe.intent || foe.moves[0];
  if (mv.cd) foe.cds[mv.name] = mv.cd;
  foe.zy = Math.max(0, foe.zy - (mv.cost ?? foe.rank * 4));
  if (mv.kind === 'attack' || mv.kind === 'drain' || mv.kind === 'stun') {
    const evaded = speed > 0 && gs.player.speed + speed > foe.speed;
    const raw = Math.round(mv.power * (0.9 + rng() * 0.2) * (evaded ? 0.7 : 1));
    if (evaded) b.logs.push('你借身法避开锋芒，受到的打击减轻。');
    const absorbed = Math.min(b.meShield, raw);
    b.meShield -= absorbed;
    const dmg = raw - absorbed;
    gs.player.hp = Math.max(0, gs.player.hp - dmg);
    b.logs.push(`${foe.name}使出「${mv.name}」，${absorbed ? `护盾挡下 ${absorbed}，` : ''}造成 ${dmg} 点伤害。`);
    if (mv.kind === 'drain' && dmg > 0) {
      const heal = Math.round(dmg * 0.4);
      foe.hp = Math.min(foe.hpMax, foe.hp + heal);
      b.logs.push(`${foe.name}吸取气血，恢复 ${heal} 点。`);
    }
    if (mv.kind === 'stun' && rng() < 0.35) {
      b.playerStunned = true;
      b.logs.push('你心神受震，下回合只能调息稳神！');
    }
  } else if (mv.kind === 'shield') {
    foe.shield += mv.power;
    b.logs.push(`${foe.name}催动「${mv.name}」，周身浮现 ${mv.power} 点护盾。`);
  } else if (mv.kind === 'heal') {
    foe.hp = Math.min(foe.hpMax, foe.hp + mv.power);
    b.logs.push(`${foe.name}催动「${mv.name}」，气血恢复 ${mv.power} 点。`);
  }

  if (gs.player.hp <= 0) {
    if (foe.practice) {
      gs.player.hp = Math.max(10, Math.round(gs.player.hpMax * 0.2));
      b.state = 'lose';
      b.logs.push('切磋点到为止，你退后认输。');
    } else {
      b.state = 'lose';
      gs.player.dead = true;
      b.logs.push('你气血耗尽，倒在了血泊之中。');
    }
  } else {
    foe.intent = pickIntent(foe, rng);
  }
}

function dealDamageToFoe(b, rawDmg, pierce = 0) {
  const foe = b.foe;
  const blockable = Math.round(rawDmg * (1 - pierce));
  const absorbed = Math.min(foe.shield, blockable);
  foe.shield -= absorbed;
  const dmg = Math.min(foe.hp, rawDmg - absorbed);
  foe.hp = Math.max(0, foe.hp - dmg);
  return { dmg, absorbed };
}
function battleGuPlan(gs) {
  const { battle, player } = gs;
  const queue = battle.guQueue ?? [];
  const choices = player.equipped.flatMap((uid) => {
    const gu = player.gu.find((g) => g.uid === uid);
    const def = GU_DEFS[gu?.id];
    if (!def || !['攻击', '控制', '防御', '治疗', '增益', '探知', '隐匿'].includes(def.kind)) return [];
    return [{ uid, def, weak: isGuWeak(gu), cooldown: Math.max(0, (battle.cds[uid] ?? 0) - 1) }];
  });
  const queued = queue.map((uid) => choices.find((choice) => choice.uid === uid)).filter(Boolean);
  const cost = queued.reduce((total, choice) => total + choice.def.cost, 0);
  return { choices, queued, cost };
}

function applyBattleGu(gs, b, gu, rng) {
  const p = gs.player;
  const foe = b.foe;
  const { def } = gu;
  p.zy -= def.cost;
  if (def.cd) b.cds[gu.uid] = def.cd;
  if (def.kind === '攻击' || def.kind === '控制') {
    const boosted = def.school === '月道' && def.kind === '攻击' && b.meBoost > 0;
    const mul = boosted ? 1.35 : 1;
    if (boosted) b.meBoost--;
    const strengthBonus = def.school === '力道' ? p.powerBonus * 0.4 : 0;
    const raw = Math.round((def.power + strengthBonus) * mul * (0.92 + rng() * 0.16));
    const res = dealDamageToFoe(b, raw, def.id === 'yuehen' ? 0.5 : 0);
    b.logs.push(`你催动「${def.name}」，${res.absorbed ? `破盾 ${res.absorbed}，` : ''}造成 ${res.dmg} 点伤害。`);
    if (def.id === 'xuefu_gu' && res.dmg > 0) {
      const leach = Math.round(res.dmg * 0.35);
      p.hp = Math.min(p.hpMax, p.hp + leach);
      b.logs.push(`血蝠蛊反哺气血 +${leach}。`);
    }
    if ((def.kind === '控制' || def.id === 'dianlang_gu') && rng() < 0.35) {
      foe.stunned = true;
      b.logs.push(`${foe.name}行动受制，本轮无法出手！`);
    }
  } else if (def.kind === '防御') {
    b.meShield += def.power;
    b.logs.push(`你催动「${def.name}」，获得 ${def.power} 点护盾。`);
  } else if (def.kind === '治疗') {
    p.hp = Math.min(p.hpMax, p.hp + def.power);
    b.logs.push(`你催动「${def.name}」，气血恢复 +${def.power}。`);
  } else if (def.kind === '增益') {
    b.meBoost += 1;
    b.logs.push(`你催动「${def.name}」，下一记月道攻击蛊的威能大增！`);
  } else if (def.kind === '探知') {
    b.scouted = true;
    b.logs.push(`你催动「${def.name}」，看清了${foe.name}的气血真元与下步动向。`);
  } else if (def.kind === '隐匿') {
    b.meShield += Math.round(def.power * 0.6);
    b.logs.push(`你催动「${def.name}」隐去身形，获得 ${Math.round(def.power * 0.6)} 点护盾。`);
  }
}
function battleAct(gs, action, arg = '', rng = Math.random) {
  const b = gs.battle;
  if (!b || b.state !== 'ongoing') return b;
  const p = gs.player;
  const foe = b.foe;

  if (action === 'lethal') {
    if (b.lethal || foe.practice) return b;
    b.lethal = true;
    b.logs.push('你眼神转冷，彻底下了死手！此战不再留手，也再无退路。');
    return b;
  }

  if (b.playerStunned) {
    if (action !== 'recover') return b;
    b.playerStunned = false;
    b.guQueue = [];
    for (const k of Object.keys(b.cds)) {
      if (b.cds[k] > 0) b.cds[k]--;
    }
    b.logs.push('你强忍心神震荡，稳住气息。');
    enemyTurn(gs, b, rng);
    b.round++;
    if (b.logs.length > 24) b.logs = b.logs.slice(-24);
    return b;
  }

  const queue = (b.guQueue ??= []);
  if (action === 'gu') {
    const uid = Number(arg);
    const index = queue.indexOf(uid);
    if (index !== -1) {
      queue.splice(index, 1);
    } else {
      const { choices, cost } = battleGuPlan(gs);
      const choice = choices.find((entry) => entry.uid === uid);
      if (choice && !choice.cooldown && !choice.weak && cost + choice.def.cost <= p.zy) queue.push(uid);
    }
    return b;
  }

  const mv = action === 'move' ? p.moves.find((m) => m.id === arg) : null;
  const plan = action === 'resolveGu' ? battleGuPlan(gs) : null;
  if (plan) {
    if (!queue.length || plan.queued.length !== queue.length || plan.cost > p.zy
      || plan.queued.some((choice) => choice.cooldown || choice.weak)) return b;
    b.guQueue = [];
  } else {
    if (queue.length || !['attack', 'stone', 'flee', 'move'].includes(action)) return b;
    if (action === 'stone' && p.yuanshi < 2) return b;
    if (action === 'flee' && b.lethal) return b;
    if (action === 'move' && (!mv || killerMoveBlock(gs, mv) || (b.cds[mv.id] ?? 0) > 1 || p.zy < mv.cost)) return b;
  }

  for (const k of Object.keys(b.cds)) {
    if (b.cds[k] > 0) b.cds[k]--;
  }

  if (action === 'attack') {
    const raw = Math.round((8 + p.rank * 4 + (p.powerBonus || 0) * 0.6) * (0.9 + rng() * 0.2));
    const res = dealDamageToFoe(b, raw);
    b.logs.push(`你挥拳直击，${res.absorbed ? `削去护盾 ${res.absorbed}，` : ''}造成 ${res.dmg} 点伤害。`);
  } else if (action === 'stone') {
    p.yuanshi -= 2;
    const gain = Math.min(p.zyMax - p.zy, Math.max(10, Math.round(p.zyMax * 0.4)));
    p.zy += gain;
    b.logs.push(`你消耗 2 块元石补充真元，真元恢复 +${gain}。`);
  } else if (action === 'flee') {
    const speed = p.speed + (b.haste?.turns > 0 ? b.haste.speed : 0);
    const chance = 0.55 + (speed - foe.speed) * 0.04 + (hasGu(gs, 'yinshi') ? 0.25 : 0);
    if (rng() < Math.max(0.2, Math.min(0.95, chance))) {
      b.state = 'fled';
      b.logs.push('你虚晃一招，顺利脱离战局。');
      return b;
    }
    b.logs.push('你想脱身退走，却被对方死死缠住！');
  } else if (action === 'resolveGu') {
    const fired = [];
    for (const gu of plan.queued) {
      applyBattleGu(gs, b, gu, rng);
      fired.push(gu.def.id);
      if (foe.hp <= 0) break;
    }
    recordGuUsage(gs, fired);
  } else if (action === 'move') {
    const effect = killerEffects(mv);
    p.zy -= mv.cost;
    b.cds[mv.id] = mv.cd;
    if (effect.kind === '防御') {
      b.meShield += effect.power;
      b.logs.push(`你催动杀招「${mv.name}」，凝出 ${effect.power} 点厚盾！`);
    } else {
      const boosted = effect.moon && b.meBoost > 0;
      if (boosted) b.meBoost--;
      const removed = Math.min(foe.shield, effect.breakShield ?? 0);
      foe.shield -= removed;
      if (removed) b.logs.push(`冲撞击碎 ${removed} 点护盾。`);
      const power = effect.power + (effect.strength ?? 0) * p.powerBonus;
      const raw = Math.round(power * (boosted ? 1.35 : 1) * (0.94 + rng() * 0.14));
      const res = dealDamageToFoe(b, raw, effect.pierce);
      b.logs.push(`你催动杀招「${mv.name}」，${res.absorbed ? `破盾 ${res.absorbed}，` : ''}重创 ${foe.name} ${res.dmg} 点！`);
      if (effect.bonusShield) {
        b.meShield += effect.bonusShield;
        b.logs.push(`辅蛊护体，附加护盾 +${effect.bonusShield}。`);
      }
      if (effect.drain && res.dmg > 0) {
        const healed = Math.min(p.hpMax - p.hp, Math.round(res.dmg * effect.drain));
        p.hp += healed;
        if (healed) b.logs.push(`血蝠反哺，气血恢复 ${Math.round(healed)} 点。`);
      }
      if (foe.hp > 0 && effect.stun && rng() < effect.stun) {
        foe.stunned = true;
        b.logs.push(`${foe.name}被雷击麻痹。`);
      }
      if (effect.speed) {
        b.haste = { speed: effect.speed, turns: 2 };
        b.logs.push(`风势助身，身法 +${effect.speed}，持续两轮。`);
      }
    }
  }

  if (foe.hp <= 0) {
    b.state = 'win';
    recordQuestProgress(gs, 'victory', foe.id);
    const rw = foe.reward || {};
    const ys = (rw.yuanshi || 0) + (b.lethal ? 15 : 0);
    if (ys > 0) p.yuanshi += ys;
    if (rw.item) addItem(gs, rw.item, 1);
    if (b.winFlag) gs.flags[b.winFlag] = true;
    if (b.winGu && addGu(gs, b.winGu)) b.logs.push(`战后获赏：「${GU_DEFS[b.winGu].name}」。`);
    if (rw.gu && !hasGu(gs, rw.gu)) {
      addGu(gs, rw.gu);
      b.logs.push(`战后缴获：「${GU_DEFS[rw.gu].name}」！`);
    }
    if (b.lethal && !foe.practice) {
      p.mo += 18;
      b.logs.push('你出手狠辣斩草除根，恶名 +18。');
    }
    if (foe.id === 'zhuwang') gs.flags['clear:zhulin'] = true;
    if (foe.id === 'xuefu_king') gs.flags['clear:xuefu'] = true;
    if (foe.id === 'langwang') gs.flags['clear:langchao'] = true;
    b.logs.push(`胜负已分！击败 ${foe.name}${ys ? `，得元石 ${ys}` : ''}。`);
    addLog(gs, `【胜出】击败 ${foe.name}${ys ? `，元石 +${ys}` : ''}。`, 'log-good');
    recalcStats(gs);
    return b;
  }

  enemyTurn(gs, b, rng);
  b.round++;
  if (b.logs.length > 24) b.logs = b.logs.slice(-24);
  return b;
}

function nextRetreatTime(gs) {
  const dates = STORY_EVENTS.filter((event) => !event.manual && !gs.flags[`event_done:${event.id}`])
    .map((event) => event.cond.match(/(?:^|&)after:([\d-]+)/)?.[1])
    .filter(Boolean).map(parseTimeExpr);
  if (gs.flags.wine_bid && !gs.flags.merchant_jiuchong_bought) dates.push(makeTime(2, 3, 1));
  return Math.min(gs.minutes + MIN_PER_MONTH, ...dates.filter((date) => date > gs.minutes));

function evalToken(gs, token) {
  if (!token) return true;
  if (token === 'benming') return !!gs.player.benming;
  if (token.startsWith('flag:')) return !!gs.flags[token.slice(5)];
  if (token.startsWith('at:')) return gs.location === token.slice(3);
  if (token.startsWith('before:')) return gs.minutes < parseTimeExpr(token.slice(7));
  if (token.startsWith('after:')) return gs.minutes >= parseTimeExpr(token.slice(6));
  if (token.startsWith('mo:')) return gs.player.mo >= Number(token.slice(3));
  if (token.startsWith('stones:')) return gs.player.yuanshi >= Number(token.slice(7));
  if (token.startsWith('rank:')) return gs.player.rank === Number(token.slice(5));
  if (token.startsWith('haiBelow:')) return gs.player.hai < Number(token.slice(9));
  if (token === 'true') return true;
  return false;
}
function evalCond(gs, cond) {
  if (!cond) return true;
  const grouped = cond.replace(/\(([^()]*)\)/g, (_, group) => String(evalCond(gs, group)));
  if (grouped !== cond) return evalCond(gs, grouped);
  return cond.split('|').some((alternative) => alternative.split('&').every((raw) => {
    const t = raw.trim();
    if (!t) return true;
    const neg = t.startsWith('!');
    const ok = evalToken(gs, neg ? t.slice(1) : t);
    return neg ? !ok : ok;
  }));
}
function checkStoryTriggers(gs, eventId) {

}
function applyEventChoice(gs, eventId, choiceIdx) {
  const ev = STORY_EVENTS.find((e) => e.id === eventId);
  if (!ev) { gs.pendingEventId = null; return; }
  const choice = ev.choices[choiceIdx];
  if (gs.pendingEventId !== eventId || gs.player.dead || gs.battle || !choice || !evalCond(gs, choice.cond)) return;
  gs.flags[`event_done:${ev.id}`] = true;
  gs.pendingEventId = null;

  for (const eff of choice.effects || []) {
    if (eff.startsWith('flag:')) {
      gs.flags[eff.slice(5)] = true;
    } else if (eff.startsWith('unflag:')) {
      delete gs.flags[eff.slice(7)];
    } else if (eff.startsWith('goal:')) {
      gs.goal = eff.slice(5);
    } else if (eff.startsWith('yuanshi:')) {
      const add = Number(eff.slice(8));
      gs.player.yuanshi += add;
      addLog(gs, `【${ev.title}】元石 ${add >= 0 ? '+' : ''}${add}。`, 'log-gold');
    } else if (eff.startsWith('mo:')) {
      const before = gs.player.mo;
      gs.player.mo = Math.max(0, before + Number(eff.slice(3)));
      const change = gs.player.mo - before;
      if (change) addLog(gs, `【${ev.title}】恶名 ${change > 0 ? '+' : ''}${change}。`, change > 0 ? 'log-bad' : 'log-good');
    } else if (eff.startsWith('item:')) {
      const [, id, count] = eff.split(':');
      addItem(gs, id, Number(count));
      addLog(gs, `【${ev.title}】获得「${ITEMS[id].name}」×${count}。`, 'log-gold');
    } else if (eff.startsWith('hai:')) {
      const p = gs.player;
      const before = p.zyMax;
      const previousHai = p.hai;
      p.hai = Math.min(9.9, Math.round((p.hai + Number(eff.slice(4))) * 10) / 10);
      p.grade = p.hai >= 8 ? '甲' : p.hai >= 6 ? '乙' : p.hai >= 4 ? '丙' : '丁';
      recalcStats(gs);
      p.zy = Math.min(p.zyMax, p.zy + p.zyMax - before);
      addLog(gs, `【${ev.title}】元海 ${previousHai} 成 → ${p.hai} 成，资质 ${p.grade} 等。`, 'log-gold');
    } else if (eff === 'exam:nianmo') {
      const score = gs.player.rank * 25 + gs.player.xiao * 8 + gs.player.gu.length * 8 + (gs.flags['clear:zhulin'] ? 20 : 0);

      if (score >= 85) { grade = '甲等'; reward = 45; }

      gs.player.yuanshi += reward;
      addLog(gs, `【年末大考】评定为${grade}，获族中赏赐元石 +${reward}。`, 'log-gold');
    } else if (eff.startsWith('gu:')) {
      const gu = addGu(gs, eff.slice(3));
      if (gu) addLog(gs, `【${ev.title}】获得「${GU_DEFS[gu.id].name}」。`, 'log-gold');
    } else if (eff.startsWith('battle:')) {
      const value = (prefix) => choice.effects.find((entry) => entry.startsWith(prefix))?.slice(prefix.length);

        winFlag: value('onwin:'),

        storyEvent: ev.id
      });
    }
  }
  if (gs.player.rank >= 2) gs.flags['open:jiazhuge'] = true;
}

function placeMoveList(gs) {
  if (!PLACES[gs.location]) return [];
  const routes = new Map([[gs.location, { minutes: 0, blocked: '' }]]);
  const pending = new Set([gs.location]);

  while (pending.size) {
    const id = [...pending].reduce((nearest, candidate) => (
      routes.get(candidate).minutes < routes.get(nearest).minutes ? candidate : nearest
    ));
    pending.delete(id);
    const route = routes.get(id);
    if (route.blocked) continue;

    for (const [next, duration] of Object.entries(PLACES[id].links)) {
      const target = PLACES[next];
      if (!target || (target.hidden && !gs.flags[target.hidden])) continue;
      const minutes = route.minutes + duration;
      if (minutes >= (routes.get(next)?.minutes ?? Infinity)) continue;
      const blocked = target.lock && !gs.flags[target.lock.flag] ? target.lock.msg : '';
      routes.set(next, { minutes, blocked });
      pending.add(next);
    }
  }

  routes.delete(gs.location);
  return [...routes].map(([id, route]) => ({ id, name: PLACES[id].name, ...route }));
}
function moveToPlace(gs, targetId) {
  if (!gs || gs.player.dead || gs.battle) return { ok: false, reason: '当前无法行脚' };
  const route = placeMoveList(gs).find((m) => m.id === targetId);
  if (!route) return { ok: false, reason: '此处无路可通' };
  if (route.blocked) return { ok: false, reason: route.blocked };
  advanceMinutes(gs, route.minutes);
  if (gs.player.dead || gs.battle) return { ok: true };
  gs.location = targetId;
  addLog(gs, `你来到了「${PLACES[targetId].name}」。`);
  recordQuestProgress(gs, 'visit', targetId);
  checkStoryTriggers(gs);
  return { ok: true };
}

    addLog(gs, `【停炉】你撤下「${sess.outName}」的炼炉，保住了入炉蛊虫。`);

  }

  const rc = REFINE_RECIPES.find((recipe) => recipe.id === sess.recipeId);

      return sess;

    sess.pending.splice(index, 1);
    const offset = Math.abs(timing - 0.5);
    if (offset <= 0.1) {
      sess.progress++;
      sess.lines.push(`「${input.name}」接住炉心的火星，蛊影聚拢了一点。`);
    } else if (offset <= 0.25) {
      sess.lines.push(`「${input.name}」平稳入炉。`);
    } else {
      const pressure = Math.min(2, sess.pressure + 1);
      sess.lines.push(`「${input.name}」擦过炉壁，溅起一片火星。`);

    } else if (offset <= 0.25) {
      sess.progress += sess.flow.gentle;
      sess.pressure = Math.max(0, sess.pressure - 1);
      sess.lines.push('火候偏了一点，蛊影慢慢聚拢。');
    } else {
      sess.pressure++;
      sess.lines.push('火星撞上炉壁，急火在炉内乱窜。');
    }
    sess.turns--;
    if (sess.pressure >= OVERLOAD_PRESSURE) finishRefining(gs, sess, rc, false, '炉压失控，炸炉了。');
    return sess;
  }

  if (action.startsWith('protect:') && sess.turns > 0 && sess.protectedUid === null) {
    const uid = Number(action.slice('protect:'.length));

  sess.lines.push(action === 'vent' ? '热气从盖缝涌出，炉火低了，蛊影也散了一点。'

    : `${technique.name}过后，炉火与蛊影随之变化。`);

}

    sess.lines.push(msg, `轰然一声脆响，窍壁彻底碎裂，你晋入${realmText(gs.player)}！`);
    const growth = realmGrowthText(before, gs.player);
    sess.lines.push(growth);
    addLog(gs, `【破境】晋入${realmText(gs.player)} · ${growth}`, 'log-gold');
    return sess;
  }

  if (sess.hurt >= 100) {
    sess.hurt = 100;
    sess.state = 'lose';
    gs.player.attempts = (gs.player.attempts || 0) + 1;
    gs.player.yuanshi = Math.max(0, gs.player.yuanshi - sess.stonesUsed);
    gs.player.hp = Math.max(5, Math.round(gs.player.hp * 0.5));
    gs.player.zy = 0;
    sess.lines.push(msg, '空窍震伤过重，真元反噬，被迫中止冲关！');
    addLog(gs, '【冲关受挫】震伤过重，退回养伤（已攒下冲关心得）。', 'log-bad');
    return sess;
  }

  const healed = Math.min(sess.crack, sess.wallHeal);
  sess.crack = Math.max(0, sess.crack - healed);
  sess.zy = Math.min(zyMax, sess.zy + Math.max(2, Math.round(zyMax * 0.06)));
  sess.lines.push(`${msg} 窍壁自愈 ${healed.toFixed(1)}%。`);
  if (sess.lines.length > 6) sess.lines = sess.lines.slice(-6);
  return sess;
}

function renderRefineFurnace(sess, effect) {
  const { state, flow, progress, pressure, success } = sess;
  const canTime = state === 'ongoing' && (sess.pending.length || sess.turns);
  const formed = progress >= flow.target;
  const hot = pressure > flow.safePressure;
  const status = state === 'ready' ? '炉火未点'
    : state === 'ongoing' ? sess.pending.length ? '等火星经过炉心，再投入蛊虫或蛊材'
      : formed && !hot ? '蛊影已经凝实，可以合盖'
      : !sess.turns ? '炉火将尽，只能收炉或撤火'
      : hot ? '炉火太旺，掀开炉盖可以放火' : '等火星经过炉心，按下风箱'
    : success ? `炼成 · ${sess.outName}`
    : state === 'aborted' ? '已停炉'
    : pressure >= OVERLOAD_PRESSURE ? '炸炉' : '炼蛊失败';
  const outcome = state === 'done' ? (success ? 'success' : 'failure') : state;
  return `<div class="refine-stage" data-state="${outcome}" data-effect="${effect?.action ?? ''}" data-hot="${hot}" style="--heat:${Math.min(1, pressure / OVERLOAD_PRESSURE)};--shape:${Math.min(1, progress / flow.target)}">
      <div class="refine-scene" aria-hidden="true">
        <div class="refine-halo"></div>
        <div class="refine-vapor"></div>
        <div class="refine-shape"></div>
        <div class="refine-flame"></div>
        <div class="refine-pot"><div class="refine-mouth"></div><div class="refine-sigil"></div></div>
        <div class="refine-lid"></div>
        <div class="refine-result"></div>
        ${effect?.input ? `<div class="refine-drop">${esc(effect.input)}</div>` : ''}
      </div>
      ${canTime ? '<div class="refine-timing" aria-hidden="true"><i></i></div>' : ''}
      <div class="refine-status" role="status">${esc(status)}</div>
      ${state === 'ongoing' && effect?.action !== 'ignite' && sess.lines.length ? `<div class="refine-feedback">${esc(sess.lines.at(-1))}</div>` : ''}
    </div>`;
}

function renderBattleView(gs) {

  const hpState = hpRatio > 0.6 ? '气息强盛' : hpRatio > 0.25 ? '已有伤势' : '摇摇欲坠';
  const hpLevel = hpRatio > 0.6 ? 'high' : hpRatio > 0.25 ? 'mid' : 'low';
  const foeHp = b.scouted
    ? `<div class="foe-hp"><span class="bar hp"><i style="width:${Math.round(hpRatio * 100)}%"></i></span><span>${foe.hp} / ${foe.hpMax}</span><span class="foe-zy">真元 ${foe.zy}/${foe.zyMax}</span></div>`
    : `<div class="foe-hp is-${hpLevel}">${hpState}</div>`;
  const intentText = foe.stunned
    ? '本轮受制，无法出手'
    : b.scouted && foe.intent
      ? `${foe.intent.name}（${foe.intent.kind === 'shield' ? '护盾' : foe.intent.kind === 'heal' ? '疗伤' : `威能约 ${foe.intent.power}`}）`
      : '未明';

  const { choices, queued, cost } = battleGuPlan(gs);
  const hasQueue = queued.length > 0;
  const guButtons = choices.map(({ uid, def, weak, cooldown }) => {
    const position = queued.findIndex((choice) => choice.uid === uid) + 1;
    const selected = position > 0;

    return `<button class="skill${selected ? ' is-picked' : ''}" aria-pressed="${selected}" title="${esc(weak ? '饥饿虚弱，喂食后方可催动' : guEffectText(def))}" ${disabled ? 'disabled' : ''} data-action="battleAct" data-kind="gu" data-id="${uid}">

  const moveButtons = p.moves.map((m) => {

    const disabled = b.playerStunned || hasQueue || blocked || cd > 0 || p.zy < m.cost;
    return `<button class="skill is-move" ${disabled ? 'disabled' : ''} title="${esc(blocked || killerEffectText(m))}" data-action="battleAct" data-kind="move" data-id="${esc(m.id)}">
      ${esc(m.name)}<small>${cd > 0 ? `冷却 ${cd}` : blocked ? '不可用' : m.cost}</small>

  const logs = b.logs.slice(-40);
  const logHtml = logs.map((l, i) => `<div${i === logs.length - 1 ? ' class="is-latest"' : ''}>${esc(l)}</div>`).reverse().join('');

  let actions;

    actions = `<button class="primary battle-finish" data-action="finishBattle">${b.state === 'win' ? '打扫战场离开' : b.state === 'fled' ? '脱身离开' : '查看结局'}</button>`;
  } else if (b.playerStunned) {
    actions = `<section class="card battle-actions">
        <div class="skill-head"><span class="log-warn">心神受震，本轮无法催动蛊虫与杀招</span></div>
        <div class="battle-basic">
          <button class="primary" data-action="battleAct" data-kind="recover">调息稳神</button>
          <span class="battle-spacer"></span>
          ${b.lethal ? '<span class="battle-lethal">死斗中 · 不可逃</span>' : ''}
        </div>
      </section>`;
  } else {
    actions = `<section class="card battle-actions">
        ${guButtons ? `<div class="skill-group">
          <div class="skill-head">
            <span>蛊虫<em>依次点选，再点取消</em></span>
            <span class="skill-plan">${hasQueue ? `${queued.map(({ def }) => esc(def.name)).join(' → ')} · ${cost} 真元` : ''}</span>
          </div>
          <div class="skill-list">${guButtons}</div>
          <button class="primary battle-go" ${hasQueue ? '' : 'disabled'} data-action="battleAct" data-kind="resolveGu">催动</button>
        </div>` : ''}
        ${moveButtons ? `<div class="skill-group">
          <div class="skill-head"><span>杀招</span></div>
          <div class="skill-list">${moveButtons}</div>
        </div>` : ''}
        <div class="battle-basic">
          <button class="sm ghost" ${hasQueue ? 'disabled' : ''} data-action="battleAct" data-kind="attack">拳脚试探</button>
          <button class="sm ghost" ${hasQueue || p.yuanshi < 2 ? 'disabled' : ''} title="消耗 2 元石回复真元" data-action="battleAct" data-kind="stone">元石回元</button>
          <span class="battle-spacer"></span>
          ${b.lethal
            ? '<span class="battle-lethal">死斗中 · 不可逃</span>'
            : `<button class="sm ghost" ${hasQueue ? 'disabled' : ''} data-action="battleAct" data-kind="flee">逃走</button>

        </div>

  }

  return `<section class="card battle-foe">

        <div class="foe-name"><b>${esc(foe.name)}</b><span>${foe.rank}转</span></div>

      <div class="battle-log">${logHtml}</div>
    </section>
    ${actions}`;
}


/* === src/ui/map-view.js === */
function renderMapPanel(gs, title = '青茅山舆图 · 可去之处') {
  const moves = placeMoveList(gs);
  const moveMap = Object.fromEntries(moves.map((m) => [m.id, m]));
  const visibleIds = Object.keys(PLACES).filter((id) => !PLACES[id].hidden || gs.flags[PLACES[id].hidden]);
  const drawn = {};
  let edges = '', nodes = '';

  for (const pid of visibleIds) {
    const place = PLACES[pid];
    for (const tid of Object.keys(place.links || {})) {
      if (!PLACES[tid] || (PLACES[tid].hidden && !gs.flags[PLACES[tid].hidden])) continue;
      const key = pid < tid ? `${pid}|${tid}` : `${tid}|${pid}`;
      if (drawn[key]) continue;
      drawn[key] = true;
      const target = PLACES[tid];
      const active = pid === gs.location || tid === gs.location;
      const other = pid === gs.location ? tid : pid;
      const cls = active ? (moveMap[other]?.blocked ? 'map-edge is-blocked' : 'map-edge is-active') : 'map-edge';
      edges += `<line class="${cls}" x1="${place.x}" y1="${place.y}" x2="${target.x}" y2="${target.y}"/>`;
    }

    const mv = moveMap[pid];
    const style = `left:${place.x}%;top:${place.y}%`;
    if (pid === gs.location) {
      const label = `<b>${esc(place.name)}</b><small>在此</small>`;
      nodes += hasPlaceActions(gs)
        ? `<button type="button" class="map-node is-here" style="${style}" data-action="openPlace" aria-haspopup="dialog">${label}</button>`
        : `<div class="map-node is-here" style="${style}">${label}</div>`;
    } else if (mv) {
      nodes += `<button type="button" class="map-node is-move" style="${style}" data-action="walkTo" data-id="${pid}" ${mv.blocked ? 'disabled title="' + esc(mv.blocked) + '"' : ''}>
        <b>${esc(place.name)}</b><small>${esc(mv.blocked ? '受阻' : formatDuration(mv.minutes))}</small>
      </button>`;
    } else {
      nodes += `<div class="map-node is-far" style="${style}"><b>${esc(place.name)}</b></div>`;
    }
  }

  const blockedHints = moves.filter((m) => m.blocked).map((m) => `<div>· ${esc(m.name)}：${esc(m.blocked)}</div>`).join('');

  return `<div class="card">
    <div class="kv"><h3>${esc(title)}</h3><span class="muted">点击金框行脚，点击当前位置查看详情</span></div>
    <div class="map-scroll">
      <div class="map-canvas ${isNight(gs.minutes) ? 'is-night' : ''}">
        <svg class="map-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${edges}</svg>
        ${nodes}
      </div>
    </div>
    ${blockedHints ? `<div class="muted" style="margin-top:8px;font-size:.82rem">${blockedHints}</div>` : ''}
  </div>`;
}

  if (discovery) actions.push(`<button class="gold" data-action="placeAct" data-id="discoverRecipe">${esc(discovery.action)}</button>`);

  if (place.services.includes('cultivate')) {
    actions.push('<button class="primary" data-action="placeAct" data-id="meditate">打坐吐纳 · 1 时辰</button>');
    actions.push('<button data-action="placeAct" data-id="rest">歇息养伤 · 4 时辰</button>');
    actions.push(`<button title="闭关期间照常消耗蛊虫口粮，请先备料并开启自动喂养" data-action="placeAct" data-id="retreat">闭关至${esc(formatDateTime(nextRetreatTime(gs)))}</button>`);
    if (gs.player.xiao < 3) actions.push('<button class="gold" data-action="washMinor">冲刷窍壁</button>');
    else actions.push('<button class="gold" data-action="openBreak">破壁冲关</button>');
  }
  if (place.services.includes('xuetang_gu')) {
    if (!gs.player.benming && !gs.player.unrefinedBenming) actions.push('<button class="gold" data-action="placeAct" data-id="pickBenming">进蛊室领本命蛊（月光蛊）</button>');
    if (gs.player.unrefinedBenming) actions.push('<button class="primary" data-action="navTab" data-tab="aperture">前往空窍炼化月光蛊</button>');
    const submission = STORY_EVENTS.find((event) => event.id === 'toumin_win');
    if (evalCond(gs, submission.cond)) actions.push('<button class="primary" data-action="checkEvents" data-id="toumin_win">向家老交卷夺头名</button>');
  }
  if (place.services.includes('practice_caoren')) {
    actions.push('<button class="gold" data-action="placeAct" data-id="caoren">与草人傀儡对练 · 2 刻</button>');
    actions.push('<button data-action="placeAct" data-id="sparring">与同窗切磋（古月方正）</button>');
  }
  if (place.services.includes('heal')) {
    actions.push('<button data-action="placeAct" data-id="docHeal">药堂疗伤（10 元石回满）</button>');
  }
  if (place.services.includes('rumor')) {
    actions.push('<button class="gold" data-action="placeAct" data-id="rumor">打听近况 · 2 刻</button>');
    if (!gs.flags['clue:huajiu']) actions.push('<button data-action="placeAct" data-id="secretRumor">买暗涧遗洞消息（12 元石）</button>');
  }
  if (place.services.includes('clan_hall')) {
    actions.push('<button class="gold" data-action="placeAct" data-id="clanGift">领取二转赏赐</button>');
  }
  if (place.services.includes('explore')) {
    actions.push('<button class="blood" data-action="placeAct" data-id="exploreFight">深入搜山（遭遇战）</button>');
    if (place.bossEnemy && !gs.flags[`clear:${place.id}`]) {
      actions.push('<button class="gold" data-action="placeAct" data-id="exploreBoss">直捣兽王巢穴</button>');
    }
    actions.push('<button data-action="placeAct" data-id="gather">采集山材 · 1 时辰</button>');
  }
  if (place.services.includes('huajiu_explore')) {
    actions.push('<button class="gold" data-action="placeAct" data-id="huajiuLoot">搜寻花酒行者遗藏</button>');
  }
  if (place.id === 'zhaimen' && gs.flags['qingmao_finished']) {
    actions.push('<button class="gold" data-action="placeAct" data-id="escapeMountain">告别青茅山（卷一通关）</button>');
  }

  let shopHtml = '';
  const shop = placeShopEntries(gs);
  const sellsRecipes = place.services.includes('recipes');
  if (shop.length) {
    const rows = shop.map((entry) => {
      const [kind, id] = entry.split(':');
      const def = kind === 'gu' ? GU_DEFS[id] : ITEMS[id];
      if (!def) return '';
      const limited = MERCHANT_GU.includes(id);
      const price = shopUnitPrice(gs, id, def.price);
      const affordable = gs.player.yuanshi >= price;
      const recipes = sellsRecipes ? REFINE_RECIPES.filter(isRecipeSold)
        .filter((recipe) => kind === 'gu' ? recipe.gu[id] : recipe.materials[id])
        .map(recipeOutputText) : [];
      const effect = kind === 'gu' ? guEffectText(def) : '';
      return `<li class="list-row">
        <div class="list-main">
          <div class="list-title">
            <b>${esc(def.name)}</b>
            ${kind === 'gu' ? `<span class="list-meta">${def.rank}转 · ${esc(def.kind)}</span>` : `<span class="list-meta">${esc(def.kind)}</span>`}
            ${limited ? '<span class="gu-tag">商队限售一只</span>' : ''}
          </div>
          <div class="list-sub" ${effect ? `title="${esc(effect)}"` : ''}>${esc(def.desc)}${effect ? ` · ${esc(effect)}` : ''}</div>
          ${recipes.length ? `<div class="list-hint">蛊方材料：${esc(recipes.join('、'))}</div>` : ''}
        </div>
        <div class="shop-purchase">
          ${limited ? '' : `<input type="number" min="1" max="${SHOP_BATCH_LIMIT}" step="1" value="1" aria-label="${esc(def.name)}购买数量" ${affordable ? '' : 'disabled'}>`}
          <button class="sm ${affordable ? '' : 'ghost'}" ${affordable ? '' : 'disabled'} data-action="buyItem" data-id="${esc(entry)}">${id === 'jiuchong' && gs.flags.wine_bid ? '竞买' : '买'} · ${price}${limited ? '' : kind === 'gu' ? '/只' : '/份'}</button>
        </div>
      </li>`;
    }).join('');
    shopHtml = `<div class="card"><div class="list-head"><h3>${esc(place.name)}货架</h3><span class="muted">余额 ${gs.player.yuanshi} 元石</span></div><ul class="list-rows">${rows}</ul></div>`;
  }

  const board = place.services.includes('quests') ? questBoard(gs) : null;
  const questHtml = board ? `<div class="card">
      <div class="list-head"><h3>族中委托</h3><span class="muted">轮换 · ${esc(formatDateTime(gs.minutes + board.remaining))}</span></div>
      <ul class="list-rows">${board.entries.map((q) => {
        const ready = q.progress === q.target;
        return `<li class="list-row">
          <div class="list-main">
            <div class="list-title"><b>${esc(q.name)}</b><span class="list-meta">赏 ${q.reward} 元石${q.accepted ? ` · ${q.progress}/${q.target}` : ''}</span></div>
            <div class="list-sub">${esc(q.desc)}</div>
          </div>
          <div class="list-side">
            <button class="sm ${ready && q.accepted && !q.claimed ? 'primary' : ''}" ${q.claimed || (q.accepted && !ready) ? 'disabled' : ''} data-action="quest" data-id="${q.id}">
              ${q.claimed ? '已交付' : !q.accepted ? '接取' : ready ? '交付领赏' : '进行中'}
            </button>
          </div>
        </li>`;
      }).join('')}</ul>
    </div>` : '';

  const recipeHtml = sellsRecipes ? `<div class="card">
      <div class="list-head"><h3>蛊方</h3></div>
      <ul class="list-rows">${REFINE_RECIPES.filter(isRecipeSold).map((r) => {
        const owned = gs.player.recipes?.includes(r.id);
        const out = GU_DEFS[r.out] || ITEMS[r.out];
        return `<li class="list-row">
          <div class="list-main">
            <div class="list-title"><b>${esc(recipeOutputText(r))}${r.method ?? ''}蛊方</b>${out.rank ? `<span class="list-meta">${out.rank}转</span>` : ''}</div>
            <div class="list-sub">${esc(recipeIngredientsText(r))}</div>
          </div>
          <div class="list-side">
            <button class="sm" ${owned || gs.player.yuanshi < r.price ? 'disabled' : ''} data-action="buyRecipe" data-id="${r.id}">${owned ? '已习得' : `买 · ${r.price} 元石`}</button>
          </div>
        </li>`;
      }).join('')}</ul>
    </div>` : '';

  return `<section class="stage ${night ? 'is-night' : ''}">
      <div class="stage-loc">${esc(formatDateTime(gs.minutes))} · ${esc(place.region)}</div>
      <h1 id="place-title">${esc(place.name)}</h1>
      <p class="stage-desc">${esc(night ? place.night : place.day)}</p>
      ${place.gather ? `<p class="muted">常见山材 · ${esc([...new Set(place.gather)].map((id) => ITEMS[id].name).join('、'))}${rareGathering(gs, place) ? ` · 今日山材丰收，可采${esc(ITEMS[place.rare.item].name)} ×4` : ''}</p>` : ''}
      <div class="row">${actions.join('')}</div>
    </section>
    ${questHtml}
    ${shopHtml}
    ${recipeHtml}`;
}


/* === src/ui/aperture-view.js === */
function renderApertureView(gs) {
  const p = gs.player;
  const needXp = minorXpNeed(p);
  const xpPct = needXp ? Math.min(100, Math.round(p.xp / needXp * 100)) : 100;

  const chips = p.gu.map((g) => {
    const def = GU_DEFS[g.id];
    if (!def) return '';
    const isBm = p.benming === g.uid;
    return `<span class="gu-chip ${g.satiety <= 20 || isGuWeak(g) ? 'weak' : ''}">${isBm ? '★' : ''}${esc(def.name)} <small>${isGuWeak(g) ? '虚弱' : `${g.satiety}%`}</small></span>`;
  }).join('');

  const order = (g) => (p.benming === g.uid ? 0 : 2) + (p.equipped.includes(g.uid) ? 0 : 1);
  const sortedGu = p.gu
    .map((g, i) => ({ g, i }))
    .sort((a, b) => order(a.g) - order(b.g)
      || (GU_DEFS[b.g.id]?.rank ?? 0) - (GU_DEFS[a.g.id]?.rank ?? 0)
      || a.i - b.i)
    .map(({ g }) => g);
  const equippedCount = p.gu.filter((g) => p.equipped.includes(g.uid)).length;

  const guRows = sortedGu.map((g) => {
    const def = GU_DEFS[g.id];
    if (!def) return '';
    const eq = p.equipped.includes(g.uid);
    const isBm = p.benming === g.uid;
    const isSheli = g.id === 'qingtong_sheli' || g.id === 'chitie_sheli' || g.id === 'baiyin_sheli';
    const food = ITEMS[def.food];
    const foodCount = p.items[def.food] ?? 0;
    const stats = guStats(def);
    const hungry = g.satiety <= 20;
    const weak = isGuWeak(g);
    const boarKey = g.id === 'heishi' ? 'blackBoarStrength' : 'whiteBoarStrength';
    const actions = [
      food ? `<button class="sm ghost" ${foodCount <= 0 || g.satiety >= 100 ? 'disabled' : ''} data-action="feedGu" data-id="${g.uid}">喂食</button>` : '',
      EQUIP_KINDS.includes(def.kind) ? `<button class="sm ${eq ? 'primary' : 'ghost'}" aria-pressed="${eq}" title="${eq ? '点击撤下' : '战斗中可催动'}" data-action="toggleEquip" data-id="${g.uid}">${eq ? '出战中' : '出战'}</button>` : '',
      isSheli ? `<button class="sm gold" data-action="useSheli" data-id="${g.uid}">炼化破境</button>` : '',
      def.kind === '治疗' ? `<button class="sm gold" data-action="useHealingGu" data-id="${g.uid}">疗伤</button>` : '',
      ['heishi', 'baishi'].includes(g.id) ? (p[boarKey]
        ? '<span class="gu-note">已得一猪之力</span>'
        : `<button class="sm gold" title="消耗此蛊，增一猪之力" data-action="useBoarGu" data-id="${g.uid}">催动</button>`) : ''
    ].join('');
    return `<li class="gu-row${eq ? ' is-equipped' : ''}">
      <div class="gu-main">
        <div class="gu-title">
          <b>${esc(def.name)}</b>
          <span class="gu-meta">${def.rank}转 · ${esc(def.kind)}</span>
          ${isBm ? '<span class="gu-tag" title="合炼失败时保留，炼成后由成蛊继承本命绑定">本命</span>' : ''}
          ${weak ? '<span class="gu-tag is-weak" title="饱食归零多日已虚弱，喂食后恢复">虚弱</span>' : ''}
        </div>
        <p class="gu-desc">${esc(def.desc)}</p>
        ${stats.length ? `<div class="gu-stats" title="${esc(guEffectText(def))}">${stats.map((s) => `<span>${esc(s)}</span>`).join('')}</div>` : ''}
      </div>
      <div class="gu-side">
        <div class="gu-hunger${hungry || weak ? ' is-low' : ''}" title="${weak ? '饥饿虚弱，无法出战' : `饱食 ${g.satiety}%`}">
          <span class="bar"><i style="width:${g.satiety}%"></i></span><span>${weak ? '虚弱' : `${g.satiety}%`}</span>
        </div>
        <div class="gu-food${food && foodCount <= 0 ? ' is-empty' : ''}">${food ? `${esc(food.name)} ×${foodCount}` : '无需喂食'}</div>
        <div class="gu-actions">${actions}</div>
      </div>
    </li>`;
  }).join('');

  const movesHtml = p.moves.length
    ? p.moves.map((m) => `<div class="card">
        <div class="kv"><b>${esc(m.name)}</b><button class="sm ghost" data-action="forgetKiller" data-id="${esc(m.id)}">删除</button></div>
        <span class="badge gold">${esc(m.kind)} · 耗${m.cost} 真元</span>
        <div class="muted">${esc(killerMoveBlock(gs, m) || `${killerEffectText(m)} · 间隔 ${m.cd - 1} 回合`)}</div>
      </div>`).join('')
    : '<div class="muted">尚未创出杀招。</div>';

  return `<div class="aperture-canvas">
      <div class="kv">
        <b>${esc(realmText(p))} · ${esc(p.grade)}等资质（元海 ${p.hai} 成）</b>
        <span ${p.xiao < 3 ? 'data-live="xp"' : ''}>${p.xiao < 3 ? `修为 ${Math.floor(p.xp)} / ${needXp}` : '本转巅峰 · 可破壁'}</span>
      </div>
      <div class="aperture-gu-list">${chips || '<span class="muted">空窍尚空</span>'}</div>
      <div class="bar"><i data-live="xp-bar" style="width:${xpPct}%"></i></div>
    </div>
    <div class="card">
      <div class="muted">${p.rank >= 4 && p.xiao >= 3 ? '已达本卷境界上限' : esc(realmGuRequirement(p).text)}</div>
      ${p.hai < 6 ? '<div class="muted">丙、丁等冲刷窍壁耗费更多真元。养好对应转数的酒虫可减轻压力，舍利蛊可直接提升一小阶。</div>' : ''}
      <div class="row">
        ${p.xiao < 3 ? '<button class="primary" data-action="washMinor">冲刷窍壁</button>' : '<button class="gold" data-action="openBreak">破壁冲关</button>'}
        <button data-action="feedAll">一键喂饱</button>
        <button data-action="toggleAutoFeed" aria-pressed="${!!p.autoFeed}" title="饱食降至 50% 或以下时，使用行囊口粮">自动喂蛊：${p.autoFeed ? '开' : '关'}</button>
        ${discoveredKillerPatterns(p).length ? '<button class="gold" data-action="openCustomKiller">自创杀招</button>' : ''}
      </div>
    </div>
    ${p.unrefinedBenming ? `<div class="card">
      <div class="kv"><b>月光蛊</b><span class="badge">待炼化</span></div>
      <button class="gold" ${p.zy < BENMING_ZY_COST ? 'disabled' : ''} data-action="refineBenming">炼化本命蛊 · ${BENMING_ZY_COST} 真元</button>
      ${p.zy < BENMING_ZY_COST ? '<span class="muted">真元不足</span>' : ''}
    </div>` : ''}
    <div class="card"><h3>杀招</h3><div class="grid2">${movesHtml}</div></div>
    <div class="card">
      <div class="gu-head"><h3>蛊囊</h3><span class="muted">${p.gu.length} 只 · 出战 ${equippedCount}</span></div>
      ${guRows ? `<ul class="gu-list">${guRows}</ul>` : '<span class="muted">暂无蛊虫</span>'}
    </div>`;
}

const EQUIP_KINDS = ['攻击', '防御', '治疗', '增益', '控制', '探知', '隐匿'];

// 卡片上只列关键数值，完整说明放在 title 中。
function guStats(def) {
  const main = {
    攻击: `伤害 ${def.power}`,
    控制: `伤害 ${def.power}`,
    防御: `护盾 ${def.power}`,
    隐匿: `护盾 ${Math.round(def.power * 0.6)}`,
    治疗: `回血 ${def.power}`,
    增益: '月光蛊伤害 +35%',
    探知: '看破敌情'
  }[def.kind];
  if (!main) return [];
  const stats = [main];
  if (def.kind === '控制' || def.id === 'dianlang_gu') stats.push('35% 打断');
  if (def.id === 'xuefu_gu') stats.push('吸血 35%');
  stats.push(`真元 ${def.cost}`);
  const wait = Math.max(0, def.cd - 1);
  if (wait) stats.push(`冷却 ${wait}`);
  return stats;
}


/* === src/ui/refine-view.js === */
function renderRefineView(gs) {
  const realm = refineRealm(gs.player);
  const known = REFINE_RECIPES.filter((r) => knowsRefineRecipe(gs, r)).map((r) => {
    const check = canStartRefine(gs, r.id);
    return { r, ok: check.ok, reason: check.reason };
  });
  known.sort((a, b) => Number(b.ok) - Number(a.ok));

  const rows = known.map(({ r, ok, reason }) => {
    const out = GU_DEFS[r.out] || ITEMS[r.out];
    const rate = Math.round(refineSuccessRate(r.rate, realm.bonus, true) * 100);
    const parts = [
      ...Object.entries(r.gu).map(([id, count]) => {
        const have = gs.player.gu.filter((g) => g.id === id).length;
        const name = `${GU_DEFS[id].name}${count > 1 ? ` ×${count}` : ''}`;
        return `<span class="${have >= count ? '' : 'is-lack'}">${esc(name)}</span>`;
      }),
      ...Object.entries(r.materials).map(([id, count]) => {
        const have = gs.player.items[id] || 0;
        const name = `${ITEMS[id].name}${count > 1 ? ` ×${count}` : ''}`;
        return `<span class="${have >= count ? '' : 'is-lack'}">${esc(name)}</span>`;
      })
    ].join('<span> + </span>');

    return `<li class="list-row${ok ? ' is-ready' : ''}">
      <div class="list-main">
        <div class="list-title">
          <b>${esc(recipeOutputText(r))}</b>
          <span class="list-meta">${out.rank ? `${out.rank}转 · ` : ''}${r.method ?? '合炼'}</span>
        </div>
        <div class="list-sub">${parts}</div>
      </div>
      <div class="list-side">
        <span class="list-note" title="${esc(reason || '材料齐备，可立即开炉')}">成算 ${rate}% · ${r.cost} 元石</span>
        <button class="sm ${ok ? 'primary' : 'ghost'}" data-action="startRefine" data-id="${r.id}">${ok ? '开炉' : '缺料'}</button>
      </div>
    </li>`;
  }).join('');

  return `<div class="card">
      <div class="list-head">
        <h3>炼蛊</h3>
        <span class="muted">炼道 · ${realm.name}（心得 ${realm.insight}${realm.next ? ` / ${realm.next}` : ''}）</span>
      </div>
      ${rows ? `<ul class="list-rows">${rows}</ul>` : '<div class="muted">尚未习得蛊方。</div>'}
    </div>`;
}
function renderRefineRequirements(materials, cost, rate, bonus) {
  return `<div class="muted">${esc(materials)}<br>开炉 ${cost} 元石 · 稳炉成算 ${Math.round(refineSuccessRate(rate, bonus, true) * 100)}%</div>`;
}
function renderRefineDetails(gs, recipe, reason) {
  return `<h2>${esc(recipeOutputText(recipe))}</h2>
    ${renderRefineRequirements(recipeIngredientsText(recipe), recipe.cost, recipe.rate, refineRealm(gs.player).bonus)}
    <div class="log-warn">${esc(reason)}</div>
    <button data-action="closeModal">返回炼蛊</button>`;
}

      return `<li class="list-row">

        </div>

    }).join('');
    const moDesc = p.mo >= 60 ? '正道公敌（铁血冷随时围捕）' : p.mo >= 30 ? '恶名昭彰（魔道捕手巡查）' : '清白';
    return `<div class="card">
        <h3>人物档案</h3>
        <div class="kv"><span>姓名 / 境界</span><b>${esc(p.name)} · ${esc(realmText(p))}</b></div>

      </div>`;

  const hasCicada = hasGu(gs, 'chunqiuchan');

        ${gs.snapshot ? '<button class="blood" data-action="rewindCicada">催动春秋蝉逆流重来</button>' : ''}
      </div>

        <button class="primary" data-action="manualSave">保存进度</button>
        <button data-action="exportSave">导出存档</button>

      <h3>青茅山行纪</h3>
